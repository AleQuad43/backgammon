<title>Backgammon</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* The app: friends float at their Elo on a sky that follows the time of day; tapping a game opens the board on the same sky.
   Colours below are the daytime set; the clock code swaps them for the night set after dusk. */
:root {
  --page: #E6ECEA; --ink: #1F2D2E; --muted: #4A5859; --line: rgba(31,45,46,0.14);
  --glass: rgba(250,252,251,0.52); --glass-strong: rgba(250,252,251,0.82); --sheet: #F4F6F5;
  --accent: #2F5D62; --on-accent: #FFFFFF;
  --warm: oklch(0.74 0.11 55); --warm-ink: oklch(0.38 0.08 50); --win: oklch(0.66 0.09 160); --loss: oklch(0.68 0.10 25);
  --p1: oklch(0.90 0.065 80); --p2: oklch(0.90 0.06 165); --p3: oklch(0.89 0.06 240); --sky: oklch(0.925 0.03 150);
  --g1: oklch(0.76 0.09 45); --g2: oklch(0.76 0.09 350); --g3: oklch(0.76 0.09 290);
  --font: 'Figtree', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
html, body { height: 100%; margin: 0; }
body { background: var(--sky); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.45; overflow: hidden; overscroll-behavior: none; -webkit-user-select: none; user-select: none; }
button { font-family: inherit; color: inherit; -webkit-tap-highlight-color: transparent; cursor: pointer; }
button:focus-visible { outline: 2.5px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }

/* ---------- home ---------- */
#home { position: fixed; inset: 0; overflow: hidden; overflow: clip; isolation: isolate; }
#home > .sky { position: absolute; inset: 0; z-index: 0; background: var(--sky); }
.col { position: absolute; left: calc(50% - min(50%, 280px)); width: min(100%, 560px); }
.bhead { top: calc(env(safe-area-inset-top, 0px) + 28px); z-index: 3; display: flex; flex-direction: column; gap: 2px; padding: 0 22px; box-sizing: border-box; }
.bhead b { font-size: 24px; font-weight: 700; letter-spacing: -0.01em; }
.bhead span { font-size: 14px; color: var(--muted); }
.field { top: 0; bottom: 0; touch-action: none; }
.axis { position: absolute; left: 10px; top: 0; bottom: 0; width: 40px; pointer-events: none; }
.axis span { position: absolute; left: 0; font-size: 11px; font-weight: 600; color: var(--muted); opacity: .7; font-variant-numeric: tabular-nums; }
.axis span::after { content: ""; position: absolute; left: 34px; top: 8px; width: 480px; border-top: 1px dashed var(--line); }
.star { position: absolute; left: 0; top: 0; width: 86px; border: none; background: none; padding: 0; display: flex; flex-direction: column; align-items: center; gap: 5px; will-change: transform; touch-action: none; cursor: grab; }
.star.held { cursor: grabbing; z-index: 2; }
.star .orb { transition: transform .25s cubic-bezier(.2,.8,.2,1); }
.star.held .orb { transform: scale(1.08); }
.orb { width: 62px; height: 62px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700; background: var(--glass-strong); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border: 1.5px solid var(--line); position: relative; }
.orb.me { background: var(--accent); color: var(--on-accent); border-color: transparent; }
.orb.yours { background: var(--warm); color: #2A1A0C; border-color: transparent; }
.orb.yours::before { content: ""; position: absolute; inset: -10px; border-radius: 50%; background: var(--warm); opacity: .35; z-index: -1; animation: halo 3.4s ease-in-out infinite; }
@keyframes halo { 50% { transform: scale(1.18); opacity: .12; } }
.orb.them { border: 2px solid var(--accent); }
.orb.req::after { content: ""; position: absolute; inset: -7px; border-radius: 50%; border: 2px dashed var(--accent); animation: spin 14s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
/* each friend is their own checker */
.orb.ck { background: none; border: none; backdrop-filter: none; -webkit-backdrop-filter: none; }
.orb.ck img { position: absolute; left: 50%; top: 50%; width: 92px; height: 92px; transform: translate(-50%, -50%); pointer-events: none; }
/* the shadow stays still on the sky while the checker itself turns */
.orb.ck .shd { position: absolute; left: 50%; top: 50%; width: 60px; height: 60px; border-radius: 50%; transform: translate(-46%, -42%); background: rgba(30,18,10,.34); filter: blur(5px); pointer-events: none; }
.orb.ck.them::after { content: ""; position: absolute; inset: -7px; border-radius: 50%; border: 2px solid var(--accent); opacity: .8; }
/* your move: the checker flips over on its north–south axis every few seconds, its edge lit;
   their move: it turns slowly flat on the sky; no game: it rests */
.orb.ck { perspective: 340px; }
.orb.ck canvas.fl { position: absolute; left: 50%; top: 50%; width: 120px; height: 120px; transform: translate(-50%, -50%); pointer-events: none; display: none; }
.orb.ck.yours canvas.fl { display: block; }
.orb.ck.yours img { display: none; }
.orb.ck.them img { animation: ckspin 14s linear infinite; }
@keyframes ckspin { from { transform: translate(-50%, -50%) rotate(0deg); } to { transform: translate(-50%, -50%) rotate(360deg); } }
.orb.ck.yours::before, .orb.ck.them::after { content: none; }
.av.ck { background: none !important; border: none !important; box-shadow: none !important; position: relative; }
.av.ck img { position: absolute; left: 50%; top: 50%; width: 148%; height: 148%; transform: translate(-50%, -50%); pointer-events: none; }
.edit { position: absolute; inset: 0; z-index: 25; background: var(--sheet); display: flex; flex-direction: column; padding: calc(env(safe-area-inset-top, 0px) + 10px) 18px calc(env(safe-area-inset-bottom, 0px) + 14px); box-sizing: border-box; gap: 10px; opacity: 0; transform: translateY(24px); transition: opacity .3s ease, transform .38s cubic-bezier(.2,.8,.2,1); max-width: 560px; margin: 0 auto; }
.edit.open { opacity: 1; transform: none; }
.ehead { display: flex; align-items: center; justify-content: space-between; }
.ehead b { font-size: 17px; font-weight: 700; }
.estage { flex: 1 1 auto; min-height: 140px; position: relative; border-radius: 24px; overflow: hidden; background: #6B4528; }
.estage canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.estage span { position: absolute; left: 0; right: 0; bottom: 10px; text-align: center; color: #FBF4E8; font-weight: 700; font-size: 17px; text-shadow: 0 1px 6px rgba(0,0,0,.4); }
.erow { display: flex; flex-direction: column; gap: 6px; }
.elab { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.elab em { font-style: normal; text-transform: none; letter-spacing: 0; color: var(--ink); font-size: 14px; margin-left: 6px; }
.esw { display: flex; gap: 10px; }
.esw button { width: 46px; height: 46px; padding: 0; border-radius: 50%; border: 2px solid transparent; background: none; display: flex; align-items: center; justify-content: center; }
.esw button[aria-pressed="true"] { border-color: var(--ink); }
.esw canvas { width: 40px; height: 40px; }
.esw .none { width: 34px; height: 34px; border-radius: 50%; border: 1.5px dashed var(--muted); }
.eage { display: flex; align-items: center; gap: 12px; }
.eage input { flex: 1; accent-color: var(--accent); height: 30px; }
.etools { display: flex; gap: 8px; }
/* sign in */
.auth { position: absolute; inset: 0; z-index: 30; display: flex; align-items: center; justify-content: center; padding: 24px 18px; box-sizing: border-box; }
.auth[hidden] { display: none; }
#home.out .bhead, #home.out .axis { visibility: hidden; }
.auth .box { width: min(100%, 420px); background: var(--glass-strong); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); border-radius: 30px; padding: 26px 22px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 24px 60px rgba(8,12,22,.18); box-sizing: border-box; }
.auth h1 { margin: 0; font-size: 30px; font-weight: 700; letter-spacing: -0.01em; }
.auth p { margin: 0 0 4px; color: var(--muted); font-size: 15px; }
.auth label { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); display: flex; flex-direction: column; gap: 6px; }
.auth input { font: inherit; font-size: 17px; height: 50px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--page); color: var(--ink); padding: 0 14px; letter-spacing: 0; text-transform: none; -webkit-user-select: text; user-select: text; box-sizing: border-box; width: 100%; }
.auth input.pin { letter-spacing: .6em; font-variant-numeric: tabular-nums; }
.auth .err { color: var(--loss); font-size: 14px; min-height: 18px; }
.auth .link { background: none; border: none; color: var(--accent); font-weight: 600; font-size: 14px; padding: 6px 0; align-self: center; }
.big.alt { background: transparent; color: var(--ink); border: 1.5px solid var(--line); }
.big:disabled { opacity: .6; }
.emails { display: flex; flex-direction: column; gap: 6px; font-size: 14px; }
.emails div { display: flex; justify-content: space-between; gap: 10px; background: var(--page); border-radius: 12px; padding: 8px 12px; }
.emails span { color: var(--muted); overflow-wrap: anywhere; text-align: right; -webkit-user-select: text; user-select: text; }
.star small { font-size: 12px; font-weight: 600; line-height: 1.15; text-align: center; padding: 3px 8px 4px; border-radius: 11px; background: color-mix(in oklab, var(--glass) 70%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
.star .st { position: absolute; left: 50%; top: -21px; transform: translateX(-50%); white-space: nowrap; font-size: 11px; font-weight: 700; letter-spacing: .02em; line-height: 1; padding: 4px 9px; border-radius: 999px;
  background: color-mix(in oklab, var(--glass-strong) 85%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); opacity: 0; transition: opacity .4s ease; pointer-events: none; }
.star .st.yours { opacity: 1; color: var(--warm-ink); box-shadow: inset 0 0 0 1px color-mix(in oklab, var(--warm) 55%, transparent); }
.star .st.them { opacity: 1; color: var(--muted); }
.star.held { z-index: 3; }
.star small em { display: block; font-style: normal; font-weight: 500; color: var(--muted); font-variant-numeric: tabular-nums; }
.legend { display: none; bottom: calc(env(safe-area-inset-bottom, 0px) + 16px); z-index: 3; padding: 0 16px; box-sizing: border-box; }
.legend div { display: flex; justify-content: space-between; gap: 6px; padding: 10px 14px; border-radius: 18px; background: var(--glass); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); font-size: 12px; color: var(--muted); }
.legend span { display: flex; align-items: center; gap: 6px; }
.legend i { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }

/* shared pieces */
.av { width: 38px; height: 38px; border-radius: 50%; flex: 0 0 auto; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; background: var(--glass-strong); border: 1.5px solid var(--line); color: var(--ink); }
.av.me { background: var(--accent); color: var(--on-accent); border-color: transparent; }
.label { font-size: 12px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); margin: 18px 4px 8px; }
.row { width: 100%; display: flex; align-items: center; gap: 12px; padding: 10px 12px; border: none; border-radius: 18px; background: var(--page); text-align: left; margin-bottom: 8px; font-size: 15px; }
.row .t { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; }
.row .t b { font-weight: 600; }
.row .t small { font-size: 13px; color: var(--muted); }
.row.yours { background: color-mix(in oklab, var(--warm) 34%, var(--page)); }
.row.yours small { color: var(--warm-ink); }
.row.req { outline: 1.5px dashed var(--accent); outline-offset: -1.5px; }
.num { font-variant-numeric: tabular-nums; }
.pip { width: 10px; height: 10px; border-radius: 50%; background: var(--warm); flex: 0 0 auto; animation: breathe 3.2s ease-in-out infinite; }
@keyframes breathe { 50% { transform: scale(1.35); opacity: .6; } }
.mini { border: 1.5px solid var(--line); background: transparent; border-radius: 12px; height: 34px; padding: 0 12px; font-size: 13px; font-weight: 600; }
.mini.go { background: var(--accent); color: var(--on-accent); border-color: transparent; }
.big { width: 100%; height: 54px; border-radius: 18px; border: none; background: var(--accent); color: var(--on-accent); font-size: 17px; font-weight: 700; }
.res { width: 26px; height: 26px; border-radius: 9px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: #fff; flex: 0 0 auto; }
.res.W { background: var(--win); } .res.L { background: var(--loss); }
.tools { display: flex; flex-wrap: wrap; gap: 8px; }

/* overlays */
.scrim { position: absolute; inset: 0; z-index: 20; background: rgba(8,12,22,0); backdrop-filter: blur(0px); -webkit-backdrop-filter: blur(0px); transition: background-color .3s ease, backdrop-filter .3s ease; border: none; padding: 0; display: none; }
.scrim.show { display: block; }
.scrim.open { background: rgba(8,12,22,0.30); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
.card { top: calc(env(safe-area-inset-top, 0px) + 20px); bottom: calc(env(safe-area-inset-bottom, 0px) + 14px); z-index: 21; display: none; padding: 0 14px; box-sizing: border-box; pointer-events: none; }
.card > div { pointer-events: auto; height: 100%; background: var(--sheet); border-radius: 30px; padding: 22px 20px; box-sizing: border-box; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; opacity: 0; transform: scale(.2); transition: transform .38s cubic-bezier(.2,.8,.2,1), opacity .22s ease; box-shadow: 0 24px 60px rgba(8,12,22,0.28); scrollbar-width: none; }
.card.show { display: block; } .card.open > div { opacity: 1; transform: none; }
.card-top { display: flex; align-items: center; gap: 14px; }
.card-top .av { width: 54px; height: 54px; font-size: 18px; }
.card-top h4 { margin: 0; font-size: 24px; font-weight: 700; }
.card-top p { margin: 0; color: var(--muted); font-size: 14px; }
.x { margin-left: auto; width: 40px; height: 40px; border-radius: 50%; border: none; background: transparent; display: flex; align-items: center; justify-content: center; color: var(--muted); }
.tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.tile { background: var(--page); border-radius: 16px; padding: 10px 12px; }
.tile small { display: block; font-size: 12px; color: var(--muted); }
.tile b { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
.strip { display: flex; gap: 4px; } .strip i { flex: 1; height: 20px; border-radius: 6px; }
.strip i.W { background: var(--win); } .strip i.L { background: var(--loss); }
.sheet { bottom: 0; z-index: 21; background: var(--sheet); border-radius: 30px 30px 0 0; padding: 12px 22px calc(env(safe-area-inset-bottom, 0px) + 26px); box-sizing: border-box; display: flex; flex-direction: column; gap: 6px; transform: translateY(105%); transition: transform .42s cubic-bezier(.2,.8,.2,1); box-shadow: 0 -10px 30px rgba(8,12,22,0.16); }
.sheet.open { transform: none; }
.grab { width: 40px; height: 5px; border-radius: 3px; background: var(--line); align-self: center; margin-bottom: 8px; }
.sheet h4 { margin: 0 0 6px; font-size: 22px; font-weight: 700; }
.pick { display: flex; gap: 10px; overflow-x: auto; padding: 4px 2px 6px; scrollbar-width: none; }
.pick button { border: none; background: none; padding: 0; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; color: var(--muted); }
.pick button .av { width: 48px; height: 48px; }
.pick button[aria-pressed="true"] { color: var(--ink); }
.pick button[aria-pressed="true"] .av { background: var(--accent); color: var(--on-accent); border-color: transparent; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { height: 40px; min-width: 48px; border-radius: 14px; border: 1.5px solid var(--line); background: transparent; font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); border-color: transparent; }
.toggle { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; font-size: 15px; }
.toast { bottom: calc(env(safe-area-inset-bottom, 0px) + 90px); z-index: 30; padding: 0 18px; box-sizing: border-box; pointer-events: none; opacity: 0; transform: translateY(10px); transition: opacity .4s ease, transform .4s ease; }
.toast div { background: var(--sheet); color: var(--ink); border-radius: 16px; padding: 12px 16px; font-size: 14px; font-weight: 500; box-shadow: 0 8px 22px rgba(10,15,30,0.18); }
.toast.show { opacity: 1; transform: none; }

/* ---------- board ---------- */
#gv { position: fixed; inset: 0; z-index: 40; background: var(--sky); }
#gv .device { position: absolute; inset: 0; overflow: hidden; color: var(--ink);
  padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
#gv .av { border: none; }
#gv .av.ck { background: none; box-shadow: none; }
#gv .railTop { display: flex; justify-content: center; margin-bottom: 4px; }
#gv .homeBtn { height: 28px; padding: 0 12px 0 8px; border: none; border-radius: 14px; background: var(--glass); display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; color: var(--ink); }
#gv .turnMsg { display: none; }
@media (orientation: portrait) and (max-width: 700px) {
  #gv .turnMsg { display: flex; position: absolute; inset: 0; z-index: 60; align-items: center; justify-content: center; flex-direction: column; gap: 14px; padding: 32px; text-align: center; font-size: 17px; font-weight: 600; background: var(--sky); }
}

#gv .sky { position: absolute; inset: 0; background: var(--gbase); }
#gv .game { position: absolute; inset: 0; display: flex; gap: 12px; padding: 12px 16px 12px 36px; box-sizing: border-box; }
#gv .game.flip { flex-direction: row-reverse; padding: 12px 36px 12px 16px; }
#gv .boardWrap { position: relative; flex: 1 1 auto; min-width: 0; }
#gv #board { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; border-radius: 14px; box-shadow: 0 10px 28px rgba(30,18,8,0.28); }

#gv .rail { flex: 0 0 128px; display: flex; flex-direction: column; justify-content: space-between; align-items: stretch; gap: 6px; padding: 2px 0; }
#gv .score { display: flex; align-items: baseline; justify-content: center; gap: 8px; text-shadow: 0 1px 10px var(--glass-strong); }
#gv .score b { font-size: 30px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
#gv .score span { font-size: 20px; color: var(--muted); }
#gv .score small { font-size: 12px; color: var(--muted); font-weight: 600; margin-left: 2px; }
#gv .status { min-height: 34px; font-size: 12px; line-height: 1.35; text-align: center; color: var(--muted); font-weight: 500; text-shadow: 0 1px 8px var(--glass-strong); }
#gv .who { display: flex; align-items: center; gap: 9px; padding: 6px 8px; border-radius: 16px; transition: background-color .8s ease; }
#gv .who.turn { background: var(--glass); }
#gv .who b { display: block; font-size: 14px; font-weight: 700; }
#gv .who small { display: block; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
#gv .av { width: 34px; height: 34px; border-radius: 50%; flex: 0 0 auto; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; position: relative; }
#gv .av.them { background: #2F3B42; color: #E9E2D2; }
#gv .av.me { background: #F3ECDF; color: #3A3026; box-shadow: inset 0 0 0 1.5px #D8CDB9; }
#gv .who.turn .av::after { content: ""; position: absolute; inset: -5px; border-radius: 50%; border: 2px solid var(--accent); opacity: .7; animation: gbreathe 3s ease-in-out infinite; }
@keyframes gbreathe { 50% { transform: scale(1.08); opacity: .3; } }

#gv .cube { align-self: center; border: none; background: transparent; display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 4px; }
#gv .cube .face { width: 50px; height: 50px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums;
  background: var(--glass-strong); color: var(--ink); box-shadow: 0 4px 12px rgba(10,15,30,0.14), inset 0 0 0 1.5px var(--line); transition: transform .3s cubic-bezier(.2,.8,.2,1), background-color .3s ease; }
#gv .cube .cl { font-size: 12px; font-weight: 700; color: var(--muted); }
#gv .cube.live .face { background: #B8352F; color: #FFFFFF; box-shadow: 0 6px 16px rgba(60,10,5,0.30); }
#gv .cube.live { cursor: grab; touch-action: none; }
#gv .cube.dragging .face { opacity: 0.25; }
#gv .cube.live .cl { color: var(--ink); }
#gv .cube.armed .face { transform: scale(1.12) rotate(-6deg); animation: gwob 1s ease-in-out infinite; }
@keyframes gwob { 50% { transform: scale(1.12) rotate(6deg); } }
#gv .cube:not(.live) { cursor: default; }
#gv .acts { display: flex; gap: 6px; min-height: 36px; }
#gv .acts button { flex: 1; height: 36px; border-radius: 12px; font-size: 13px; font-weight: 700; border: none; transition: opacity .3s ease; }
#gv .acts .ghost { background: var(--glass); }
#gv .acts .go { background: var(--accent); color: var(--on-accent); }
#gv .acts button[hidden] { display: block !important; visibility: hidden; }

#gv .slide { position: absolute; pointer-events: none; font-size: 16px; font-weight: 700; color: #FFFFFF; white-space: nowrap; text-shadow: 0 1px 3px rgba(40,20,10,0.65), 0 0 14px rgba(40,20,10,0.45); transform: translate(-50%, -100%); }
#gv .slide[hidden], #gv .over[hidden], #gv .cubeFloat[hidden] { display: none !important; }
#gv .cubeFloat { position: absolute; left: 0; top: 0; width: 50px; height: 50px; z-index: 5; pointer-events: none; perspective: 400px; }
#gv .cubeFloat.home { transition: left .35s cubic-bezier(.2,.8,.2,1), top .35s cubic-bezier(.2,.8,.2,1); }
#gv .cf-in { position: absolute; inset: 0; transform-style: preserve-3d; }

      else { applyDice(d.dice, !fresh); say(NAME.them + ' is playing.'); }
    }
    cubeUI();
  }
  /* Opening roll: each device throws its own die and merges it in. Once both dice have landed, the higher one
     starts; that device writes the start. On a tie, your device (seat A) clears both for another throw. */
  function applyOpening(d, fresh) {
    var mine = (d.open && d.open[DUO.seat]) || (DUO.myOpen && DUO.myOpen.round === (d.round || 0) ? DUO.myOpen : null), his = d.open && d.open[DUO.other];
    var dm = D.filter(function (x) { return x.live && x.side === ME; }), dh = D.filter(function (x) { return x.live && x.side === TH; });
    if (!mine && dm.length) { dm.forEach(function (x) { x.live = false; }); D = D.filter(function (x) { return x.live; }); dm = []; }
    if (!his && dh.length) { dh.forEach(function (x) { x.live = false; }); D = D.filter(function (x) { return x.live; }); dh = []; DUO.openN.his = null; }
    if (his && DUO.openN.his !== his.n) {
      DUO.openN.his = his.n; dh.forEach(function (x) { x.live = false; }); D = D.filter(function (x) { return x.live; });
      if (!fresh && his.t) throwVec(TH, [his.v], his.t, settleSync); else placeDie(TH, his.v);
    }
    if (mine && !dm.length) placeDie(ME, mine.v);
    G.turn = mine ? TH : ME; G.phase = mine ? 'openWait' : 'opening';
    say(!mine ? (his ? NAME.them + ' rolled ' + his.v + '. Throw yours.' : 'Throw your die to see who starts.') : his ? '' : 'Waiting for ' + NAME.them + ' to throw.');
    checkOpening();
  }
  function duoOpenThrow(from) {
    throwDice(ME, 1, from, settleSync);
    var dd = D[D.length - 1], up = { by: DUO.seat, open: {} };
    DUO.myOpen = { v: dd.v, n: nonce(), t: [vecOf(dd)], round: (DUO.lastDoc && DUO.lastDoc.round) || 0 };
    up.open[DUO.seat] = { v: DUO.myOpen.v, n: DUO.myOpen.n, t: DUO.myOpen.t };
    G.phase = 'openWait';
    enqueue(function () { return DUO.ref.update(up); });
  }
  function settleSync() {
    var d = DUO && DUO.lastDoc; if (!d) return;
    if (d.phase === 'opening') checkOpening(); else if (d.phase === 'move') applyDice(d.dice, false);
  }
  function checkOpening() {
    var d = DUO.lastDoc; if (!d || d.phase !== 'opening' || G.rolling) return;
    var dm = D.filter(function (x) { return x.live && x.side === ME; })[0], dh = D.filter(function (x) { return x.live && x.side === TH; })[0];
    if (!dm || !dh || !dm.settled || !dh.settled) return;
    var key = d.game + ':' + (d.round || 0); if (DUO.resolved === key) return; DUO.resolved = key;
    if (dm.v === dh.v) {
      say('Both ' + dm.v + '. Throw again.');
      if (DUO.seat === 'A') setTimeout(function () {
        var ld = DUO.lastDoc; if (!ld || ld.phase !== 'opening' || ld.game + ':' + (ld.round || 0) !== key) return;
        var doc = JSON.parse(JSON.stringify(ld)); doc.v = DUO.V + 1; doc.by = DUO.seat; doc.round = (ld.round || 0) + 1; doc.open = { A: null, B: null };
        DUO.V = doc.v; applyShared(doc, false); enqueue(function () { return DUO.ref.set(doc); });
      }, 1100);
      return;
    }
    var starter = dm.v > dh.v ? ME : TH;
    say((starter === ME ? 'You start' : NAME.them + ' starts') + ' with ' + Math.max(dm.v, dh.v) + ' and ' + Math.min(dm.v, dh.v) + '.');
    setTimeout(function () {
      var ld = DUO.lastDoc; if (!ld || ld.phase !== 'opening' || ld.game + ':' + (ld.round || 0) !== key) return;
      [dm, dh].forEach(function (x) { x.side = starter; x.tidy = true; x.popT = 0; });
      D.sort(function (a, b) { return b.v - a.v; });
      setTurn(starter);
      if (starter === ME) { G.phase = 'move'; G.hist = []; DUO.diceN = nonce(); DUO.diceT = null; afterMyMove(); }
      else { G.phase = 'remote'; say(NAME.them + ' is playing.'); }
    }, 1300);
  }
  function setNames() {
    var them = DUO ? SEATS[DUO.other] : OPP, me = DUO ? SEATS[DUO.seat] : { ini: 'QU' };
    NAME.them = them.name; $('nmThem').textContent = them.name; if (window.ckAv) { ckAv($('avThem'), them.ini); ckAv($('avMe'), me.ini); } else { $('avThem').textContent = them.ini; $('avMe').textContent = me.ini; }
  }
  function joinDuo(seat) {
    if (DUO && DUO.unsub) DUO.unsub();
    DUO = { seat: seat, other: seat === 'A' ? 'B' : 'A', ref: DB.doc('games/' + (window.GAMEID || 'duo')), V: 0, chain: Promise.resolve(), game: null, openN: {}, first: true, lastDoc: null };
    setNames(); resetLocal({ game: null }); say('Joining the shared game…');
    var me = DUO, timer = setTimeout(function () { if (DUO === me) say('Can’t reach the shared game yet.'); }, 10000);
    me.unsub = me.ref.onSnapshot(function (snap) {
      if (DUO !== me) return;
      clearTimeout(timer);
      if (!snap.exists) { if (me.first) { me.first = false; newGame(true); } return; }
      var d = snap.data(), fresh = me.first; me.first = false;
      if (!d || !d.board) return;
      if (!fresh) {
        if ((d.v || 0) < me.V) return;
        if (d.by === me.seat && (d.v || 0) <= me.V && d.phase !== 'opening') return;
      }
      me.V = Math.max(me.V, d.v || 0);
      applyShared(d, fresh);
    }, function (e) { clearTimeout(timer); if (DUO === me) say('Lost the shared game' + (e && e.code ? ' (' + e.code + ')' : '') + '. Reload to try again.'); });
  }
  function leaveDuo() {
    if (DUO && DUO.unsub) DUO.unsub();
    DUO = null; setNames(); G = null; start();
  }
  function pickSeat() {
    var o = $('over'); o.hidden = false;
    o.innerHTML = '<div><b>Who plays on this device?</b><span>Open this page on both devices and pick a different side on each.</span>' +
      '<button data-s="A">Quad</button><button data-s="B">Nolf</button><button data-s="ai" class="alt">Play against the computer</button></div>';
    Array.prototype.forEach.call(o.querySelectorAll('button'), function (b) {
      b.addEventListener('click', function () {
        var s = b.getAttribute('data-s'); try { localStorage.setItem('duoSeat', s); } catch (e) {}
        o.hidden = true; if (s === 'ai') { if (DUO) leaveDuo(); } else joinDuo(s);
      });
    });
  }
  /* Local testing only: two tabs on this computer share a fake store through localStorage (add ?mock&seat=A). */
  function mockDb() {
    var subs = [];
    function read(p) { try { return JSON.parse(localStorage.getItem('mock:' + p)); } catch (e) { return null; } }
    function snap(p) { var v = read(p); return { exists: !!v, data: function () { return v; }, metadata: {} }; }
    function emit(p) { subs.forEach(function (s) { if (s.p === p) s.fn(snap(p)); }); }
    window.addEventListener('storage', function (e) { if (e.key && e.key.indexOf('mock:') === 0) emit(e.key.slice(5)); });
    function merge(a, b) { Object.keys(b).forEach(function (k) { if (b[k] && typeof b[k] === 'object' && !Array.isArray(b[k]) && a[k] && typeof a[k] === 'object') merge(a[k], b[k]); else a[k] = b[k]; }); return a; }
    return { doc: function (p) { return {
      set: function (d) { return new Promise(function (r) { setTimeout(function () { localStorage.setItem('mock:' + p, JSON.stringify(d)); emit(p); r(); }, 120); }); },
      update: function (d) { return new Promise(function (r, j) { setTimeout(function () { var v = read(p); if (!v) { j({ code: 'invalid_argument' }); return; } localStorage.setItem('mock:' + p, JSON.stringify(merge(v, d))); emit(p); r(); }, 120); }); },
      onSnapshot: function (fn) { var s = { p: p, fn: fn }; subs.push(s); setTimeout(function () { fn(snap(p)); }, 60); return function () { subs = subs.filter(function (x) { return x !== s; }); }; }
    }; } };
  }
  function connect() {
    var q = location.search, use = window.claude && window.claude.use ? window.claude.use('db') : Promise.resolve(/[?&]mock/.test(q) ? mockDb() : null);
    use.then(function (db) {
      if (!db) { NODB = true; if (PENDING) { var f0 = PENDING; PENDING = null; f0(); } return; }
      DB = db;
      if (PENDING) { var f = PENDING; PENDING = null; f(); }
    }).catch(function () { NODB = true; });
  }

  /* ---------- App hooks: the home screen opens and closes the board ---------- */
  var OPP = { name: 'Nolf', ini: 'NO' }, CUR = null, PENDING = null, NODB = false;
  function storedSeat() { var m = location.search.match(/[?&]seat=([AB])/); if (m) return m[1]; try { return localStorage.getItem('duoSeat'); } catch (e) { return null; } }
  function showBoard() { $('gv').hidden = false; layout(); paintSky(skyA); }
  window.BG = {
    open: function (o) {
      showBoard();
      /* Real accounts: one shared game per pair of friends, seat decided by the app. */
      if (o.gid && !NODB) {
        if (!DB) { PENDING = function () { window.BG.open(o); }; say('Connecting to the shared game…'); return; }
        if (DUO && DUO.gid !== o.gid) { if (DUO.unsub) DUO.unsub(); DUO = null; G = null; }
        CUR = o.id; SEATS.A = o.seats.A; SEATS.B = o.seats.B; OPP = SEATS[o.seat === 'A' ? 'B' : 'A'];
        if (!DUO) { CASE.fresh = true; MATCH = o.to || 5; window.GAMEID = o.gid; joinDuo(o.seat); DUO.gid = o.gid; }
        return;
      }
      if (o.duo && !NODB) {
        if (!DB) { PENDING = function () { window.BG.open(o); }; if (!G) { OPP = o; setNames(); start(); } say('Connecting to the shared game…'); return; }
        CUR = 'duo';
        if (!DUO) { CASE.fresh = true; var s = storedSeat(); if (s === 'A' || s === 'B') joinDuo(s); else pickSeat(); }
        return;
      }
      if (DUO) { if (DUO.unsub) DUO.unsub(); DUO = null; }
      var fresh = CUR !== o.id || !G; CUR = o.id; OPP = o; setNames();
      if (fresh) { CASE.fresh = true; G = null; start(); }
    },
    close: function () { $('gv').hidden = true; $('over').hidden = true; },
    seat: function () { CUR = 'duo'; showBoard(); if (DB) pickSeat(); else say('The shared game needs the published page.'); },
    bearOff: function () { tryBearOff(); },
    restart: function () { if (DUO) newGame(true); else { G = null; start(); } },
    current: function () { return DUO && !DUO.gid ? 'no' : CUR; },
    ready: function () { return !!G && $('over').hidden && !$('gv').hidden && (CUR !== 'duo' || !!(DUO && DUO.lastDoc)); }
  };
  $('homeBtn').addEventListener('click', function () { window.BG.close(); if (window.onBoardClosed) window.onBoardClosed(); });

  /* ---------- start ---------- */
  function start() {
    $('over').hidden = true;
    var keep = G ? G.score : (OPP.score || { me: 0, them: 0 }); $('scTo').textContent = 'to ' + MATCH;
    G = { turn: ME, phase: 'opening', hist: [], cube: { v: 1, owner: null }, score: keep, rolling: false };
    $('scMe').textContent = keep.me; $('scThem').textContent = keep.them;
    setup(); D = []; pips(); setTurn(ME);
    var v = rnd6(), R = region(TH), d = newDie(TH, v, (R.x0 + R.x1) / 2, L.mid, 0, 0);
    d.settled = true; d.face = v; d.tidy = true; d.a = 0; D.push(d);
    say(NAME.them + ' rolled ' + v + ' when they challenged you. Throw yours.');
  }
  window.addEventListener('resize', function () { if (!$('gv').hidden) layout(); });

  /* Full screen: on a phone the first tap anywhere asks for it (and for landscape); on desktop use the button. */
  function goFull() {
    var el = document.documentElement, req = el.requestFullscreen || el.webkitRequestFullscreen;
    if (!req || document.fullscreenElement || document.webkitFullscreenElement) return;
    try {
      var p = req.call(el, { navigationUI: 'hide' });
      if (p && p.then) p.then(function () { if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(function () {}); }).catch(function () {});
    } catch (e) {}
  }
  function onFullChange() {
    var on = !!(document.fullscreenElement || document.webkitFullscreenElement);
    document.body.classList.toggle('full', on);
    setTimeout(function () { fit(); layout(); }, 60);
  }
  document.addEventListener('fullscreenchange', onFullChange);
  document.addEventListener('webkitfullscreenchange', onFullChange);
  connect();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { fit(); });
  requestAnimationFrame(frame);
})();
</script>
