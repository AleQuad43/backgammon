<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Checker workshop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Avatar study: each player is a real checker. Material + tone + face carving (+ optional inlay). */
:root { --ink: #2A2420; --muted: #6B5F55; --glass: rgba(255,250,244,0.55); --line: rgba(42,36,32,0.14); }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; font-family: 'Figtree', system-ui, sans-serif; color: var(--ink);
  background: radial-gradient(60% 50% at 15% 10%, oklch(0.9 0.07 70), transparent 70%),
              radial-gradient(60% 60% at 90% 30%, oklch(0.88 0.06 20), transparent 70%),
              radial-gradient(70% 60% at 40% 100%, oklch(0.88 0.05 240), transparent 70%), oklch(0.93 0.03 60); }
main { max-width: 980px; margin: 0 auto; padding: 28px 16px 60px; }
h1 { font-size: 30px; margin: 0; letter-spacing: -0.01em; }
.sub { color: var(--muted); margin: 4px 0 22px; }
.stage { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.pane { border-radius: 22px; overflow: hidden; position: relative; aspect-ratio: 1.25; }
.pane canvas { width: 100%; height: 100%; display: block; }
.pane span { position: absolute; left: 14px; top: 10px; font-size: 12px; font-weight: 600; letter-spacing: .04em; color: rgba(255,250,244,.8); }
.pane.sky span { color: var(--muted); }
.wood { background: #6B4528; }
.sky { background: var(--glass); backdrop-filter: blur(10px); }
.controls { margin-top: 18px; background: var(--glass); backdrop-filter: blur(10px); border-radius: 22px; padding: 16px 16px 6px; }
.row { margin-bottom: 14px; }
.row b { display: block; font-size: 12px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
.opts { display: flex; flex-wrap: wrap; gap: 8px; }
.opts button { font: inherit; font-size: 14px; border: 1px solid var(--line); background: rgba(255,255,255,.5); color: var(--ink);
  border-radius: 999px; padding: 7px 14px 7px 8px; display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }
.opts button.on { background: var(--ink); color: #FFF8EF; border-color: var(--ink); }
.opts canvas { width: 26px; height: 26px; }
h2 { font-size: 18px; margin: 30px 0 4px; }
.shelf { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; margin-top: 12px; }
.item { border-radius: 18px; background: #5E3D24; padding: 6px 6px 10px; text-align: center; cursor: pointer; }
.item canvas { width: 100%; aspect-ratio: 1.15; display: block; }
.item div { font-size: 12px; color: rgba(255,246,234,.85); line-height: 1.3; }
.shuffle { font: inherit; margin-top: 12px; border: 1px solid var(--line); background: var(--glass); border-radius: 999px; padding: 9px 18px; cursor: pointer; color: var(--ink); }
@media (max-width: 640px) { .stage { grid-template-columns: 1fr; } h1 { font-size: 26px; } }
</style>
</head>
<body>
<main>
  <h1>Shesh Besh · checker workshop</h1>
  <p class="sub">Your avatar is a real checker. Pick the material, its tone, how the face is carved, and an optional inlay.</p>
  <div class="stage">
    <div class="pane wood"><span>ON THE TABLE</span><canvas id="tilt"></canvas></div>
    <div class="pane sky"><span>ON THE HOME SKY</span><canvas id="top"></canvas></div>
  </div>
  <div class="controls">
    <div class="row"><b>Material</b><div class="opts" id="oMat"></div></div>
    <div class="row"><b>Tone</b><div class="opts" id="oTone"></div></div>
    <div class="row"><b>Face</b><div class="opts" id="oFace"></div></div>
    <div class="row"><b>Inlay</b><div class="opts" id="oInlay"></div></div>
  </div>
  <h2>A shelf of combinations</h2>
  <div class="shelf" id="shelf"></div>
  <button class="shuffle" id="shuf">Shuffle the shelf</button>
</main>
<script>
(function () {
  /* ---------- materials: real ranges only. gloss: how polished the surface is ---------- */
  var MAT = {
    wood:  { n: 'Wood', gloss: 0.45, tones: [
      ['Maple', '#E2C28D', '#B98F57'], ['Olive', '#C9AE7C', '#6E5434'], ['Cherry', '#A65F3D', '#6D3520'],
      ['Walnut', '#6A4529', '#3A2414'], ['Ebony', '#2E2420', '#120D0B'] ] },
    marble: { n: 'Marble', gloss: 1, tones: [
      ['Carrara', '#ECEBE6', '#8F949A'], ['Travertine', '#E3D3B8', '#A88A62'], ['Verde', '#2F5848', '#C9D8CC'],
      ['Rosso', '#8C3A30', '#E2B8A4'], ['Nero', '#232325', '#D9D6D0'] ] },
    bone:  { n: 'Bone', gloss: 0.25, tones: [
      ['White', '#F3EEE2', '#CFC3AA'], ['Ivory', '#EFE3C8', '#C7B08A'], ['Tea', '#E1CCA2', '#A8885A'],
      ['Aged', '#CDB283', '#8C6C42'], ['Camel', '#B8955F', '#6E5230'] ] },
    bakelite: { n: 'Bakelite', gloss: 0.9, tones: [
      ['Butterscotch', '#D8922E', '#F2C46A'], ['Cherry', '#8E1E1E', '#C2503F'], ['Racing green', '#1F4A35', '#4F8A64'],
      ['Navy', '#1E2C48', '#4A6490'], ['Jet', '#18181A', '#45454A'] ] }
  };
  var FACES = [['flat', 'Flat'], ['dish', 'Dished'], ['rings', 'Turned rings'], ['star', 'Eight-point star'], ['rosette', 'Rosette']];
  var INLAYS = [['none', 'None'], ['pearl', 'Mother-of-pearl'], ['brass', 'Brass']];
  var S = { m: 'wood', t: 3, f: 'rings', i: 'none' };

  /* ---------- noise ---------- */
  function hash(x, y, s) { var h = Math.imul(x, 374761393) ^ Math.imul(y, 668265263) ^ Math.imul(s, 1442695041); h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967295; }
  function vn(x, y, s) { var xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi, u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
    var a = hash(xi, yi, s), b = hash(xi + 1, yi, s), c = hash(xi, yi + 1, s), d = hash(xi + 1, yi + 1, s); return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v; }
  function fbm(x, y, s, o) { var t = 0, a = 0.5, f = 1; for (var i = 0; i < o; i++) { t += a * vn(x * f, y * f, s + i); f *= 2; a *= 0.5; } return t; }
  function rgb(h) { var n = parseInt(h.slice(1), 16); return [n >> 16, n >> 8 & 255, n & 255]; }
  function mix(a, b, t) { return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t]; }
  function lum(c) { return (c[0] * 0.3 + c[1] * 0.59 + c[2] * 0.11) / 255; }

  /* ---------- material textures, made once per material + tone ---------- */
  var TEX = {}, N = 256;
  function texture(m, t) {
    var key = m + t; if (TEX[key]) return TEX[key];
    var cv = document.createElement('canvas'); cv.width = cv.height = N;
    var g = cv.getContext('2d'), img = g.createImageData(N, N), d = img.data, tn = MAT[m].tones[t];
    var A = rgb(tn[1]), B = rgb(tn[2]), seed = t * 17 + m.length * 101;
    for (var y = 0; y < N; y++) for (var x = 0; x < N; x++) {
      var c, k = (y * N + x) * 4;
      if (m === 'wood') {           /* long grain with soft early/late wood and fibres */
        var w = y / N * 9 + fbm(x / 70, y / 22, seed, 4) * 3.2 + x / N * 0.6;
        var ring = w - Math.floor(w), late = Math.pow(ring, 3.2);
        var fib = fbm(x / 2.5, y / 60, seed + 9, 3);
        c = mix(A, B, late * 0.75 + (fib - 0.5) * 0.35);
      } else if (m === 'marble') {  /* clouds plus sharp veins */
        var cl = fbm(x / 90, y / 90, seed, 5);
        var tt = (x * 0.8 + y * 0.6) / N * 3.2 + fbm(x / 45, y / 45, seed + 3, 5) * 5.5;
        var vein = Math.pow(1 - Math.abs(Math.sin(tt * Math.PI)), 18), vein2 = Math.pow(1 - Math.abs(Math.sin(tt * 2.7 * Math.PI + 1)), 40);
        c = mix(A, B, Math.min(1, (cl - 0.5) * 0.25 + vein * 0.75 + vein2 * 0.4));
      } else if (m === 'bone') {    /* fine lengthwise striations, a few pores */
        var st = fbm(x / 1.6, y / 70, seed, 4), bl = fbm(x / 60, y / 60, seed + 5, 3);
        c = mix(A, B, Math.max(0, (st - 0.45) * 0.55 + (bl - 0.5) * 0.5));
        if (hash(x, y, seed + 7) < 0.0016) c = mix(c, B, 0.7);
      } else {                      /* bakelite / catalin: soft marbled swirls */
        var sw = fbm(x / 80, y / 80, seed, 5) * 7 + (x + y) / N * 1.5;
        var s1 = 0.5 + 0.5 * Math.sin(sw * 2.2);
        c = mix(A, B, Math.pow(s1, 3) * 0.6);
      }
      d[k] = c[0]; d[k + 1] = c[1]; d[k + 2] = c[2]; d[k + 3] = 255;
    }
    g.putImageData(img, 0, 0);
    return (TEX[key] = cv);
  }

  /* ---------- one checker seen from above. Light comes from the top left. ---------- */
  function lin(g, R, a, b) { var gr = g.createLinearGradient(-R, -R, R, R); gr.addColorStop(0, a); gr.addColorStop(1, b); return gr; }
  function circle(g, r) { g.beginPath(); g.arc(0, 0, r, 0, Math.PI * 2); }

  function incised(g, R, path, w, dark) {
    var o = Math.max(0.6, R * 0.012);
    g.lineJoin = 'round'; g.lineCap = 'round';
    g.save(); g.translate(o, o); path(); g.strokeStyle = 'rgba(255,248,235,' + (dark ? 0.32 : 0.5) + ')'; g.lineWidth = w; g.stroke(); g.restore();
    g.save(); g.translate(-o * 0.6, -o * 0.6); path(); g.strokeStyle = 'rgba(20,10,4,' + (dark ? 0.75 : 0.42) + ')'; g.lineWidth = w; g.stroke(); g.restore();
  }

  function drawTop(g, o, R, opts) {
    var M = MAT[o.m], tn = M.tones[o.t], base = rgb(tn[1]), dark = lum(base) < 0.35, gloss = M.gloss;
    opts = opts || {};
    if (!opts.noShadow) {
      g.save(); g.filter = 'blur(' + (R * 0.12) + 'px)'; g.fillStyle = 'rgba(30,18,10,0.38)';
      g.beginPath(); g.ellipse(R * 0.1, R * 0.16, R * 0.98, R * 0.98, 0, 0, Math.PI * 2); g.fill(); g.restore();
    }
    /* body */
    g.save(); circle(g, R); g.clip();
    g.save(); g.rotate((o.t * 0.9 + o.m.length) % 6); g.drawImage(texture(o.m, o.t), -R * 1.05, -R * 1.05, R * 2.1, R * 2.1); g.restore();
    /* rounded edge: bright where it faces the light, dark where it turns away */
    var rg = g.createRadialGradient(0, 0, R * 0.8, 0, 0, R);
    rg.addColorStop(0, 'rgba(0,0,0,0)'); rg.addColorStop(0.7, 'rgba(0,0,0,0.12)'); rg.addColorStop(1, 'rgba(0,0,0,0.45)');
    g.fillStyle = rg; g.fillRect(-R, -R, 2 * R, 2 * R);
    g.beginPath(); g.arc(0, 0, R, 0, Math.PI * 2); g.arc(0, 0, R * 0.84, 0, Math.PI * 2, true);
    g.fillStyle = lin(g, R, 'rgba(255,250,240,0.38)', 'rgba(0,0,0,0.35)'); g.fill();
    /* the crisp edge where the flat face meets the rounding */
    circle(g, R * 0.84); g.lineWidth = Math.max(0.8, R * 0.018); g.strokeStyle = lin(g, R, 'rgba(255,250,240,0.55)', 'rgba(0,0,0,0.25)'); g.stroke();

    /* face carving */
    var lw = Math.max(1, R * 0.035);
    if (o.f === 'dish') {
      circle(g, R * 0.6); g.fillStyle = lin(g, R * 0.6, 'rgba(0,0,0,' + (dark ? 0.45 : 0.22) + ')', 'rgba(255,250,240,0.22)'); g.fill();
      circle(g, R * 0.6); g.lineWidth = lw * 0.8; g.strokeStyle = lin(g, R * 0.6, 'rgba(10,5,0,0.45)', 'rgba(255,250,240,0.6)'); g.stroke();
    } else if (o.f === 'rings') {
      [0.66, 0.5, 0.34].forEach(function (r) { incised(g, R, function () { circle(g, R * r); }, lw, dark); });
    } else if (o.f === 'star') {
      var r8 = R * 0.52;
      incised(g, R, function () {
        g.beginPath(); for (var q = 0; q < 2; q++) { var a0 = q * Math.PI / 4; for (var i = 0; i < 4; i++) { var a = a0 + i * Math.PI / 2 + Math.PI / 4; var x = Math.cos(a) * r8, y = Math.sin(a) * r8; if (i === 0) g.moveTo(x, y); else g.lineTo(x, y); } g.closePath(); }
      }, lw, dark);
      incised(g, R, function () { circle(g, R * 0.2); }, lw * 0.8, dark);
    } else if (o.f === 'rosette') {
      var rr = R * 0.27;
      incised(g, R, function () { g.beginPath(); for (var i = 0; i < 6; i++) { var a = i * Math.PI / 3; g.moveTo(Math.cos(a) * rr + rr, Math.sin(a) * rr); g.arc(Math.cos(a) * rr, Math.sin(a) * rr, rr, 0, Math.PI * 2); } }, lw * 0.8, dark);
      incised(g, R, function () { circle(g, rr * 2); }, lw * 0.9, dark);
    }

    /* inlay */
    if (o.i !== 'none') {
      var ir = R * (o.f === 'flat' ? 0.2 : 0.14);
      g.save(); g.translate(0, 0);
      circle(g, ir * 1.12); g.fillStyle = 'rgba(15,8,2,0.55)'; g.fill();
      circle(g, ir); g.save(); g.clip();
      if (o.i === 'pearl') {
        g.fillStyle = '#EDE8DE'; g.fillRect(-ir, -ir, 2 * ir, 2 * ir);
        var cg = g.createConicGradient ? g.createConicGradient(0.7, 0, 0) : null;
        if (cg) { ['rgba(255,190,210,.55)', 'rgba(170,230,215,.55)', 'rgba(170,190,255,.55)', 'rgba(255,240,190,.55)', 'rgba(255,190,210,.55)'].forEach(function (c, i, a) { cg.addColorStop(i / (a.length - 1), c); }); g.fillStyle = cg; g.fillRect(-ir, -ir, 2 * ir, 2 * ir); }
        for (var b = 0; b < 5; b++) { g.beginPath(); g.arc(-ir * 0.3, -ir * 0.2, ir * (0.3 + b * 0.25), 0, Math.PI * 2); g.strokeStyle = 'rgba(255,255,255,.25)'; g.lineWidth = ir * 0.06; g.stroke(); }
      } else {
        var bg = g.createRadialGradient(-ir * 0.35, -ir * 0.4, ir * 0.1, 0, 0, ir);
        bg.addColorStop(0, '#FFF0B8'); bg.addColorStop(0.45, '#D9A945'); bg.addColorStop(1, '#7A5418'); g.fillStyle = bg; g.fillRect(-ir, -ir, 2 * ir, 2 * ir);
      }
      g.restore(); g.restore();
    }

    /* finish: broad sheen, then the sharp highlight for polished materials */
    var sh = g.createLinearGradient(-R, -R, R * 0.4, R * 0.4);
    sh.addColorStop(0, 'rgba(255,255,255,' + (0.1 + gloss * 0.16) + ')'); sh.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = sh; g.fillRect(-R, -R, 2 * R, 2 * R);
    if (gloss > 0.3) {
      g.save(); g.translate(-R * 0.4, -R * 0.44); g.rotate(-0.7); g.scale(1, 0.45);
      var hg = g.createRadialGradient(0, 0, 0, 0, 0, R * (0.55 - gloss * 0.2));
      hg.addColorStop(0, 'rgba(255,255,255,' + (gloss * 0.85) + ')'); hg.addColorStop(0.35, 'rgba(255,255,255,' + (gloss * 0.3) + ')'); hg.addColorStop(1, 'rgba(255,255,255,0)');
      g.fillStyle = hg; g.beginPath(); g.arc(0, 0, R, 0, Math.PI * 2); g.fill(); g.restore();
      /* reflected light along the bottom right rim */
      g.beginPath(); g.arc(0, 0, R * 0.93, 0.1 * Math.PI, 0.4 * Math.PI); g.strokeStyle = 'rgba(255,255,255,' + (gloss * 0.25) + ')'; g.lineWidth = R * 0.05; g.lineCap = 'round'; g.stroke();
    }
    g.restore();
  }

  /* ---------- the same checker tilted, so you see its thickness ---------- */
  function drawTilt(g, o, R) {
    var k = 0.52, T = R * 0.34, tn = MAT[o.m].tones[o.t];
    g.save(); g.filter = 'blur(' + (R * 0.1) + 'px)'; g.fillStyle = 'rgba(20,10,4,0.5)';
    g.beginPath(); g.ellipse(R * 0.12, T + R * 0.1, R * 1.02, R * k * 1.02, 0, 0, Math.PI * 2); g.fill(); g.restore();
    /* side wall */
    g.save();
    g.beginPath(); g.moveTo(-R, 0); g.lineTo(-R, T); g.ellipse(0, T, R, R * k, 0, Math.PI, 0, true); g.lineTo(R, 0); g.ellipse(0, 0, R, R * k, 0, 0, Math.PI, false); g.closePath(); g.clip();
    g.drawImage(texture(o.m, o.t), -R, -R * k, 2 * R, T + 2 * R * k);
    var wg = g.createLinearGradient(-R, 0, R, 0);
    wg.addColorStop(0, 'rgba(0,0,0,0.35)'); wg.addColorStop(0.25, 'rgba(255,250,240,0.12)'); wg.addColorStop(0.55, 'rgba(0,0,0,0.12)'); wg.addColorStop(1, 'rgba(0,0,0,0.6)');
    g.fillStyle = wg; g.fillRect(-R, -R, 2 * R, T + 2 * R);
    var vg = g.createLinearGradient(0, 0, 0, T + R * k); vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,0.3)');
    g.fillStyle = vg; g.fillRect(-R, -R, 2 * R, T + 2 * R);
    if (MAT[o.m].gloss > 0.6) { var sg = g.createLinearGradient(-R * 0.75, 0, -R * 0.45, 0); sg.addColorStop(0, 'rgba(255,255,255,0)'); sg.addColorStop(0.5, 'rgba(255,255,255,0.16)'); sg.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = sg; g.fillRect(-R * 0.75, 0, R * 0.3, T + R * k); }
    if (o.m === 'wood') for (var l = 1; l < 3; l++) { g.beginPath(); g.ellipse(0, T * l / 3, R, R * k, 0, 0, Math.PI); g.strokeStyle = 'rgba(0,0,0,0.12)'; g.lineWidth = 1; g.stroke(); }
    g.restore();
    /* top face */
    g.save(); g.scale(1, k); drawTop(g, o, R, { noShadow: true }); g.restore();
  }

  /* ---------- canvases ---------- */
  function prep(cv) { var r = cv.getBoundingClientRect(), d = window.devicePixelRatio || 1; cv.width = Math.round(r.width * d); cv.height = Math.round(r.height * d); var g = cv.getContext('2d'); return { g: g, w: cv.width, h: cv.height }; }
  function feltWood(g, w, h) {
    var gr = g.createLinearGradient(0, 0, 0, h); gr.addColorStop(0, '#7A5030'); gr.addColorStop(1, '#55361F'); g.fillStyle = gr; g.fillRect(0, 0, w, h);
    g.globalAlpha = 0.18; for (var i = 0; i < 40; i++) { g.beginPath(); var y = i / 40 * h + Math.sin(i) * 6; g.moveTo(0, y); g.bezierCurveTo(w * 0.3, y + 8, w * 0.6, y - 8, w, y + 3); g.strokeStyle = i % 3 ? '#3B2412' : '#9A6B42'; g.lineWidth = 1 + i % 2; g.stroke(); } g.globalAlpha = 1;
  }
  function render() {
    var a = prep($('tilt')); feltWood(a.g, a.w, a.h); a.g.translate(a.w / 2, a.h * 0.42); drawTilt(a.g, S, Math.min(a.w, a.h) * 0.33);
    var b = prep($('top')); b.g.translate(b.w / 2, b.h / 2); drawTop(b.g, S, Math.min(b.w, b.h) * 0.3);
    buttons();
  }
  function $(id) { return document.getElementById(id); }
  function mini(o, size) { var c = document.createElement('canvas'), d = window.devicePixelRatio || 1; c.width = c.height = size * d; var g = c.getContext('2d'); g.translate(size * d / 2, size * d / 2); drawTop(g, o, size * d * 0.42, { noShadow: true }); return c; }
  function opt(el, list, key, sample) {
    el.innerHTML = '';
    list.forEach(function (it) {
      var b = document.createElement('button'); if (S[key] === it[0]) b.className = 'on';
      var o = Object.assign({}, S); o[key] = it[0]; if (sample) b.appendChild(mini(o, 26));
      b.appendChild(document.createTextNode(it[1]));
      b.onclick = function () { S[key] = it[0]; render(); }; el.appendChild(b);
    });
  }
  function buttons() {
    opt($('oMat'), Object.keys(MAT).map(function (k) { return [k, MAT[k].n]; }), 'm', true);
    opt($('oTone'), MAT[S.m].tones.map(function (t, i) { return [i, t[0]]; }), 't', true);
    opt($('oFace'), FACES, 'f', true);
    opt($('oInlay'), INLAYS, 'i', true);
  }
  function shelf() {
    var el = $('shelf'); el.innerHTML = ''; var ks = Object.keys(MAT);
    for (var n = 0; n < 8; n++) {
      var o = { m: ks[Math.random() * 4 | 0], t: Math.random() * 5 | 0, f: FACES[Math.random() * 5 | 0][0], i: Math.random() < 0.7 ? 'none' : INLAYS[1 + (Math.random() * 2 | 0)][0] };
      var it = document.createElement('div'); it.className = 'item'; var c = document.createElement('canvas'); it.appendChild(c);
      var cap = document.createElement('div'); cap.textContent = MAT[o.m].tones[o.t][0] + ' ' + MAT[o.m].n.toLowerCase() + ', ' + FACES.filter(function (f) { return f[0] === o.f; })[0][1].toLowerCase() + (o.i !== 'none' ? ', ' + (o.i === 'pearl' ? 'pearl' : 'brass') : '');
      it.appendChild(cap); el.appendChild(it);
