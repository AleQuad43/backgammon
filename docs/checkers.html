<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Checker workshop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Avatar study: each player is a real checker. Material + tone + face carving (+ optional inlay). */
:root { --ink: #2A2420; --muted: #6B5F55; --glass: rgba(255,250,244,0.55); --line: rgba(42,36,32,0.14); }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; font-family: 'Figtree', system-ui, sans-serif; color: var(--ink);
  background: radial-gradient(60% 50% at 15% 10%, oklch(0.9 0.07 70), transparent 70%),
              radial-gradient(60% 60% at 90% 30%, oklch(0.88 0.06 20), transparent 70%),
              radial-gradient(70% 60% at 40% 100%, oklch(0.88 0.05 240), transparent 70%), oklch(0.93 0.03 60); }
main { max-width: 980px; margin: 0 auto; padding: 28px 16px 60px; }
h1 { font-size: 30px; margin: 0; letter-spacing: -0.01em; }
.sub { color: var(--muted); margin: 4px 0 22px; }
.stage { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.pane { border-radius: 22px; overflow: hidden; position: relative; aspect-ratio: 1.25; }
.pane canvas { width: 100%; height: 100%; display: block; }
.pane span { position: absolute; left: 14px; top: 10px; font-size: 12px; font-weight: 600; letter-spacing: .04em; color: rgba(255,250,244,.8); }
.pane.sky span { color: var(--muted); }
.wood { background: #6B4528; }
.sky { background: var(--glass); backdrop-filter: blur(10px); }
.controls { margin-top: 18px; background: var(--glass); backdrop-filter: blur(10px); border-radius: 22px; padding: 16px 16px 6px; }
.row { margin-bottom: 14px; }
.row b { display: block; font-size: 12px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
.opts { display: flex; flex-wrap: wrap; gap: 8px; }
.opts button { font: inherit; font-size: 14px; border: 1px solid var(--line); background: rgba(255,255,255,.5); color: var(--ink);
  border-radius: 999px; padding: 7px 14px 7px 8px; display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }
.opts button.on { background: var(--ink); color: #FFF8EF; border-color: var(--ink); }
.opts canvas { width: 26px; height: 26px; }
.opts button#rewear, .opts button#surprise { padding: 7px 14px; }
.age { display: flex; align-items: center; gap: 12px; }
.age input { flex: 1; accent-color: #6B4528; height: 28px; }
.age span { min-width: 110px; font-size: 14px; }
h2 { font-size: 18px; margin: 30px 0 4px; }
.shelf { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; margin-top: 12px; }
.item { border-radius: 18px; background: #5E3D24; padding: 6px 6px 10px; text-align: center; cursor: pointer; }
.item canvas { width: 100%; aspect-ratio: 1.15; display: block; }
.item div { font-size: 12px; color: rgba(255,246,234,.85); line-height: 1.3; }
.shuffle { font: inherit; margin-top: 12px; border: 1px solid var(--line); background: var(--glass); border-radius: 999px; padding: 9px 18px; cursor: pointer; color: var(--ink); }
@media (max-width: 640px) { .stage { grid-template-columns: 1fr; } h1 { font-size: 26px; } }
</style>
</head>
<body>
<main>
  <h1>Shesh Besh · checker workshop</h1>
  <p class="sub">Your avatar is a real checker. Pick the material, its tone, how the face is carved, and an optional inlay.</p>
  <div class="stage">
    <div class="pane wood"><span>ON THE TABLE</span><canvas id="tilt"></canvas></div>
    <div class="pane sky"><span>ON THE HOME SKY</span><canvas id="top"></canvas></div>
  </div>
  <div class="controls">
    <div class="row"><b>Material</b><div class="opts" id="oMat"></div></div>
    <div class="row"><b>Tone</b><div class="opts" id="oTone"></div></div>
    <div class="row"><b>Face</b><div class="opts" id="oFace"></div></div>
    <div class="row"><b>Inlay</b><div class="opts" id="oInlay"></div></div>
    <div class="row"><b>Age</b>
      <div class="age"><input type="range" id="age" min="0" max="1" step="0.01" value="0"><span id="ageName">New</span></div>
      <div class="opts" style="margin-top:10px"><button id="rewear">New wear</button><button id="surprise">Surprise me</button></div>
    </div>
  </div>
  <h2>A shelf of combinations</h2>
  <div class="shelf" id="shelf"></div>
  <button class="shuffle" id="shuf">Shuffle the shelf</button>
</main>
<script>
(function () {
  /* ---------- materials: real ranges only. gloss: how polished the surface is ---------- */
  var MAT = {
    wood:  { n: 'Wood', gloss: 0.45, tones: [
      ['Maple', '#E2C28D', '#B98F57'], ['Olive', '#C9AE7C', '#6E5434'], ['Cherry', '#A65F3D', '#6D3520'],
      ['Walnut', '#6A4529', '#3A2414'], ['Ebony', '#2E2420', '#120D0B'] ] },
    marble: { n: 'Marble', gloss: 1, tones: [
      ['Carrara', '#ECEBE6', '#8F949A'], ['Travertine', '#E3D3B8', '#A88A62'], ['Verde', '#2F5848', '#C9D8CC'],
      ['Rosso', '#8C3A30', '#E2B8A4'], ['Nero', '#232325', '#D9D6D0'] ] },
    bone:  { n: 'Bone', gloss: 0.25, tones: [
      ['White', '#F3EEE2', '#CFC3AA'], ['Ivory', '#EFE3C8', '#C7B08A'], ['Tea', '#E1CCA2', '#A8885A'],
      ['Aged', '#CDB283', '#8C6C42'], ['Camel', '#B8955F', '#6E5230'] ] },
    bakelite: { n: 'Bakelite', gloss: 0.9, tones: [
      ['Butterscotch', '#D8922E', '#F2C46A'], ['Cherry', '#8E1E1E', '#C2503F'], ['Racing green', '#1F4A35', '#4F8A64'],
      ['Navy', '#1E2C48', '#4A6490'], ['Jet', '#18181A', '#45454A'] ] },
    classic: { n: 'Classic', gloss: 0.55, tones: [
      ['White', '#F3ECDF', '#E3D8C3'], ['Black', '#2F3B42', '#222B31'] ] }
  };
  /* thickness ÷ diameter, from real sets: tournament acrylic 12 / 44 mm, vintage bakelite 9.7 / 49 mm,
     extra-thick wood 10 mm; marble and bone kept a touch slimmer */
  var THICK = { wood: 0.27, marble: 0.22, bone: 0.2, bakelite: 0.22, classic: 0.22 };
  /* edge profile, as a fraction of the radius: moulded bakelite is soft and pillowy, turned wood rounded on the lathe,
     classic acrylic gently eased, bone sliced thin and barely eased, marble cut flat with a small polished chamfer */
  var EDGE = { wood: { k: 'round', e: 0.1 }, marble: { k: 'chamfer', e: 0.06 }, bone: { k: 'round', e: 0.035 }, bakelite: { k: 'round', e: 0.17 }, classic: { k: 'round', e: 0.08 } };
  function rimIn(m) { var E = EDGE[m] || { e: 0.12 }; return 1 - Math.max(0.05, Math.min(0.24, E.e * 1.35)); }
  var FACES = [['flat', 'Flat'], ['dish', 'Dished'], ['rings', 'Turned rings'], ['star', 'Eight-point star'], ['rosette', 'Rosette']];
  var INLAYS = [['none', 'None'], ['pearl', 'Mother-of-pearl'], ['brass', 'Brass']];
  var S = { m: 'wood', t: 3, f: 'rings', i: 'none', a: 0, s: 1 + (Math.random() * 99999 | 0) };

  /* ---------- noise ---------- */
  function hash(x, y, s) { var h = Math.imul(x, 374761393) ^ Math.imul(y, 668265263) ^ Math.imul(s, 1442695041); h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967295; }
  function vn(x, y, s) { var xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi, u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
    var a = hash(xi, yi, s), b = hash(xi + 1, yi, s), c = hash(xi, yi + 1, s), d = hash(xi + 1, yi + 1, s); return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v; }
  function fbm(x, y, s, o) { var t = 0, a = 0.5, f = 1; for (var i = 0; i < o; i++) { t += a * vn(x * f, y * f, s + i); f *= 2; a *= 0.5; } return t; }
  function rgb(h) { var n = parseInt(h.slice(1), 16); return [n >> 16, n >> 8 & 255, n & 255]; }
  function mix(a, b, t) { return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t]; }
  function lum(c) { return (c[0] * 0.3 + c[1] * 0.59 + c[2] * 0.11) / 255; }

  /* ---------- material textures, made once per material + tone ---------- */
  var TEX = {}, N = 256;
  function texture(m, t) {
    var key = m + t; if (TEX[key]) return TEX[key];
    var cv = document.createElement('canvas'); cv.width = cv.height = N;
    var g = cv.getContext('2d'), img = g.createImageData(N, N), d = img.data, tn = MAT[m].tones[t];
    var A = rgb(tn[1]), B = rgb(tn[2]), seed = t * 17 + m.length * 101;
    for (var y = 0; y < N; y++) for (var x = 0; x < N; x++) {
      var c, k = (y * N + x) * 4;
      if (m === 'wood') {           /* long grain with soft early/late wood and fibres */
        var w = y / N * 9 + fbm(x / 70, y / 22, seed, 4) * 3.2 + x / N * 0.6;
        var ring = w - Math.floor(w), late = Math.pow(ring, 3.2);
        var fib = fbm(x / 2.5, y / 60, seed + 9, 3);
        c = mix(A, B, late * 0.75 + (fib - 0.5) * 0.35);
      } else if (m === 'marble') {  /* clouds plus sharp veins */
        var cl = fbm(x / 90, y / 90, seed, 5);
        var tt = (x * 0.8 + y * 0.6) / N * 3.2 + fbm(x / 45, y / 45, seed + 3, 5) * 5.5;
        var vein = Math.pow(1 - Math.abs(Math.sin(tt * Math.PI)), 18), vein2 = Math.pow(1 - Math.abs(Math.sin(tt * 2.7 * Math.PI + 1)), 40);
        c = mix(A, B, Math.min(1, (cl - 0.5) * 0.25 + vein * 0.75 + vein2 * 0.4));
      } else if (m === 'bone') {    /* fine lengthwise striations, a few pores */
        var st = fbm(x / 1.6, y / 70, seed, 4), bl = fbm(x / 60, y / 60, seed + 5, 3);
        c = mix(A, B, Math.max(0, (st - 0.45) * 0.55 + (bl - 0.5) * 0.5));
        if (hash(x, y, seed + 7) < 0.0016) c = mix(c, B, 0.7);
      } else if (m === 'classic') { /* the board's own set: plain resin with the faintest cloud */
        c = mix(A, B, Math.max(0, (fbm(x / 110, y / 110, seed, 4) - 0.45) * 0.6));
      } else {                      /* bakelite / catalin: soft marbled swirls */
        var sw = fbm(x / 80, y / 80, seed, 5) * 7 + (x + y) / N * 1.5;
        var s1 = 0.5 + 0.5 * Math.sin(sw * 2.2);
        c = mix(A, B, Math.pow(s1, 3) * 0.6);
      }
      d[k] = c[0]; d[k + 1] = c[1]; d[k + 2] = c[2]; d[k + 3] = 255;
    }
    g.putImageData(img, 0, 0);
    return (TEX[key] = cv);
  }

  /* ---------- one checker seen from above. Light comes from the top left. ---------- */
  function lin(g, R, a, b) { var gr = g.createLinearGradient(-R, -R, R, R); gr.addColorStop(0, a); gr.addColorStop(1, b); return gr; }
  function circle(g, r) { g.beginPath(); g.arc(0, 0, r, 0, Math.PI * 2); }

  var AGE_DIRT = 0;
  function incised(g, R, path, w, dark) {
    var o = Math.max(0.6, R * 0.012);
    g.lineJoin = 'round'; g.lineCap = 'round';
    g.save(); g.translate(o, o); path(); g.strokeStyle = 'rgba(255,248,235,' + (dark ? 0.32 : 0.5) * (1 - AGE_DIRT * 0.6) + ')'; g.lineWidth = w; g.stroke(); g.restore();
    g.save(); g.translate(-o * 0.6, -o * 0.6); path(); g.strokeStyle = 'rgba(20,10,4,' + (dark ? 0.75 : 0.42) + ')'; g.lineWidth = w; g.stroke(); g.restore();
    /* old checkers keep dirt packed into their carvings */
    if (AGE_DIRT > 0.05) { path(); g.strokeStyle = 'rgba(38,24,10,' + (AGE_DIRT * 0.55) + ')'; g.lineWidth = w * 0.7; g.stroke(); }
  }

  /* ---------- ageing. Each material grows old its own way; the seed decides where. ---------- */
  var AGE = {
    /* patina: colour it drifts toward. grime: dirt in the grain. chips/scratch/dent/crack: how many at full age.
       frac: colour of fresh broken material. rub: worn edges get lighter. haze: polish turning dull. */
    wood:     { patina: ['#7A4E24', 0.42], grime: 0.55, chips: 3, scratch: 22, dent: 9, crack: 2, frac: '#D9B884', rub: 0.18, haze: 0 },
    marble:   { patina: ['#CDB98E', 0.32], grime: 0.32, chips: 4, scratch: 34, dent: 0, crack: 3, frac: '#EEEBE4', rub: 0.22, haze: 0.08 },
    bone:     { patina: ['#B5832F', 0.6],  grime: 0.5,  chips: 3, scratch: 10, dent: 3, crack: 6, frac: '#EFE6D0', rub: 0.18, haze: 0 },
    bakelite: { patina: ['#B98422', 0.38], grime: 0.38, chips: 5, scratch: 46, dent: 3, crack: 1, frac: null,      rub: 0.25, haze: 0.1 },
    classic:  { patina: ['#A88A5C', 0.3],  grime: 0.4,  chips: 4, scratch: 38, dent: 4, crack: 1, frac: null,      rub: 0.22, haze: 0.08 }
  };
  function rng(seed) { var a = seed >>> 0; return function () { a = (a + 0x6D2B79F5) | 0; var t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
  var DIRT = {};
  function dirtTex(seed) {
    if (DIRT[seed]) return DIRT[seed];
    var n = 128, cv = document.createElement('canvas'); cv.width = cv.height = n;
    var g = cv.getContext('2d'), img = g.createImageData(n, n), d = img.data;
    for (var y = 0; y < n; y++) for (var x = 0; x < n; x++) {
      var dx = x / n - 0.5, dy = y / n - 0.5, r = Math.sqrt(dx * dx + dy * dy) * 2;
      var v = fbm(x / 22, y / 22, seed, 4), speck = hash(x, y, seed + 3) < 0.012 ? 0.6 : 0;
      var a = Math.max(0, (v - 0.42) * 2.2) * (0.55 + 0.6 * r * r) + speck, k = (y * n + x) * 4;
      d[k] = 56; d[k + 1] = 34; d[k + 2] = 12; d[k + 3] = Math.min(255, a * 255);
    }
    g.putImageData(img, 0, 0); return (DIRT[seed] = cv);
  }
  function fracColour(o) { var base = rgb(MAT[o.m].tones[o.t][1]), f = AGE[o.m].frac; var c = f ? mix(base, rgb(f), 0.5) : mix(base, [235, 225, 205], 0.38); return 'rgb(' + c.map(Math.round).join(',') + ')'; }
  /* where the edge has broken off: same on the top view and the tilted one */
  function chipsFor(o, R) {
    var a = o.a || 0, A = AGE[o.m], r = rng((o.s || 1) * 31 + 7), out = [];
    var n = Math.floor(Math.max(0, a - 0.22) / 0.78 * A.chips + r() * 0.7);
    for (var i = 0; i < n; i++) {
      var th = r() * Math.PI * 2, s = R * (0.07 + 0.11 * r()) * (0.7 + a * 0.5), pts = [];
      var cx = Math.cos(th) * (R + s * 0.08), cy = Math.sin(th) * (R + s * 0.08), m = 7 + (r() * 3 | 0);
      for (var j = 0; j < m; j++) { var q = j / m * Math.PI * 2 + r() * 0.5, rr = s * (0.55 + 0.6 * r()); pts.push([cx + Math.cos(q) * rr, cy + Math.sin(q) * rr]); }
      out.push({ th: th, s: s, pts: pts, R: R });
    }
    return out;
  }
  function poly(g, pts, sx, sy, oy) { g.beginPath(); pts.forEach(function (p, i) { var x = p[0] * sx, y = p[1] * sy + (oy || 0); if (i) g.lineTo(x, y); else g.moveTo(x, y); }); g.closePath(); }
  function layer(R) { var c = document.createElement('canvas'), n = Math.ceil(R * 2.6); c.width = c.height = n; var g = c.getContext('2d'); g.translate(n / 2, n / 2); return { cv: c, g: g, h: n / 2 }; }
  function taper(g, c, sy, T, f) {
    var px = Math.cos(c.th) * R0(c), py = Math.sin(c.th) * R0(c), k = 1 - 0.75 * f, dy = T * 0.6 * f * (0.5 + 0.5 * Math.sin(c.th));
    g.beginPath(); c.pts.forEach(function (p, i) { var x = px + (p[0] - px) * k, y = (py + (p[1] - py) * k) * sy + dy; if (i) g.lineTo(x, y); else g.moveTo(x, y); }); g.closePath();
  }
  function R0(c) { return c.R; }
  function breakChips(g, o, chips, sy, T) {
    if (!chips.length) return;
    var fc = fracColour(o);
    chips.forEach(function (c) {
      g.save(); g.globalCompositeOperation = 'destination-out'; g.fillStyle = '#000';
      poly(g, c.pts, 1, sy); g.fill();
      if (T && Math.sin(c.th) > -0.2) for (var st = 1; st <= 10; st++) { taper(g, c, sy, T, st / 10); g.fill(); }
      g.restore();
      /* the fresh break: lighter, rough material, only painted where the checker still is */
      g.save(); g.globalCompositeOperation = 'source-atop';
      var lit = 0.5 + 0.5 * Math.cos(c.th - Math.PI * 1.25);
      g.globalAlpha = 0.45 + 0.4 * lit; poly(g, c.pts, 1, sy); g.strokeStyle = fc; g.lineWidth = c.s * 0.3; g.lineJoin = 'round'; g.stroke();
      g.globalAlpha = 1; poly(g, c.pts, 1, sy); g.strokeStyle = 'rgba(30,18,8,' + (0.35 - lit * 0.2) + ')'; g.lineWidth = c.s * 0.08; g.stroke();
      if (T && Math.sin(c.th) > -0.2) { taper(g, c, sy, T, 0.5); g.strokeStyle = 'rgba(30,18,8,0.25)'; g.lineWidth = c.s * 0.25; g.stroke(); }

      g.restore();
    });
  }
  /* wear painted onto the body (inside its clip) */
  function wearBody(g, o, R) {
    var a = o.a || 0; if (a < 0.01) return;
    var A = AGE[o.m], r = rng((o.s || 1) * 13 + 3), base = rgb(MAT[o.m].tones[o.t][1]), dark = lum(base) < 0.35;
    g.save(); g.globalCompositeOperation = 'multiply'; g.globalAlpha = a * A.patina[1]; g.fillStyle = A.patina[0]; g.fillRect(-R, -R, 2 * R, 2 * R); g.restore();
    g.save(); g.globalAlpha = Math.min(1, a * A.grime * 1.3); g.rotate(r() * 6); g.drawImage(dirtTex((o.s || 1) % 997), -R, -R, 2 * R, 2 * R); g.restore();
    /* dirt collects where the face meets the edge */
    var eg = g.createRadialGradient(0, 0, R * 0.7, 0, 0, R * 0.86); eg.addColorStop(0, 'rgba(40,25,10,0)'); eg.addColorStop(1, 'rgba(40,25,10,' + (a * A.grime * 0.5) + ')');
    g.fillStyle = eg; g.fillRect(-R, -R, 2 * R, 2 * R);
    /* edges rubbed by hands: lighter patches along the rim */
    g.save(); g.lineCap = 'round';
    for (var i = 0; i < 5; i++) { var s0 = r() * Math.PI * 2, len = 0.2 + r() * 0.6; g.beginPath(); g.arc(0, 0, R * (0.9 + r() * 0.06), s0, s0 + len); g.strokeStyle = 'rgba(255,245,225,' + (a * A.rub * (dark ? 0.7 : 0.5) * (0.3 + r() * 0.7)) + ')'; g.lineWidth = R * (0.025 + r() * 0.035); g.stroke(); }
    g.restore();
  }
  /* marks on the surface, drawn above carvings and inlay */
  function wearMarks(g, o, R) {
    var a = o.a || 0; if (a < 0.01) return;
    var A = AGE[o.m], r = rng((o.s || 1) * 7 + 11), base = rgb(MAT[o.m].tones[o.t][1]), dark = lum(base) < 0.35, u = Math.max(0.5, R * 0.006);
    g.save(); g.lineCap = 'round';
    /* dents: little crushed crescents */
    var nd = Math.floor(Math.pow(a, 1.2) * A.dent + r() * 0.5);
    for (var i = 0; i < nd; i++) {
      var q = r() * Math.PI * 2, d0 = Math.sqrt(r()) * R * 0.85, x = Math.cos(q) * d0, y = Math.sin(q) * d0, s = R * (0.02 + r() * 0.035);
      g.beginPath(); g.arc(x, y, s, Math.PI * 0.9, Math.PI * 1.9); g.strokeStyle = 'rgba(25,14,5,' + (0.35 + a * 0.3) + ')'; g.lineWidth = u * 2; g.stroke();
      g.beginPath(); g.arc(x, y, s, -0.1, Math.PI * 0.9); g.strokeStyle = 'rgba(255,245,225,0.3)'; g.lineWidth = u * 1.4; g.stroke();
    }
    /* scratches: straight hairlines, or polishing swirls on bakelite */
    var ns = Math.floor(Math.pow(a, 1.3) * A.scratch);
    for (i = 0; i < ns; i++) {
      var q2 = r() * Math.PI * 2, d1 = Math.sqrt(r()) * R * 0.92, x1 = Math.cos(q2) * d1, y1 = Math.sin(q2) * d1, L = R * (0.06 + r() * 0.3), ang = r() * Math.PI * 2;
      g.beginPath();
      if (o.m === 'bakelite' && r() < 0.6) g.arc(x1 + Math.cos(ang) * L, y1 + Math.sin(ang) * L, L, ang + Math.PI, ang + Math.PI + 0.6 + r());
      else { g.moveTo(x1, y1); g.quadraticCurveTo(x1 + Math.cos(ang) * L * 0.5 + (r() - 0.5) * L * 0.2, y1 + Math.sin(ang) * L * 0.5, x1 + Math.cos(ang) * L, y1 + Math.sin(ang) * L); }
      g.strokeStyle = 'rgba(255,250,240,' + ((dark ? 0.16 : 0.32) * (0.4 + r() * 0.6)) + ')'; g.lineWidth = u * (0.6 + r() * 0.8); g.stroke();
      if (!dark && r() < 0.5) { g.strokeStyle = 'rgba(60,40,20,0.18)'; g.lineWidth = u * 0.6; g.stroke(); }
    }
    /* cracks: from the rim inward. Bone splits most, marble crazes, wood checks along its edge */
