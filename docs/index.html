<script>
/* Firebase behind the same small doc/set/update/onSnapshot shape the board already uses.
   Each game is kept as one JSON string, so nested arrays are fine; update is a read-merge-write transaction. */
window.fbDb = function () {
  if (!window.firebase || !window.FB_CONFIG) return null;
  var fs = firebase.apps.length ? firebase.firestore() : (firebase.initializeApp(window.FB_CONFIG), firebase.firestore());
  function merge(a, b) { Object.keys(b).forEach(function (k) { if (b[k] && typeof b[k] === 'object' && !Array.isArray(b[k]) && a[k] && typeof a[k] === 'object') merge(a[k], b[k]); else a[k] = b[k]; }); return a; }
  function val(s) { return s.exists ? JSON.parse(s.data().j) : null; }
  return { doc: function (p) { var r = fs.doc(p); return {
    set: function (d) { return r.set({ j: JSON.stringify(d), t: Date.now() }); },
    update: function (d) { return fs.runTransaction(function (tx) { return tx.get(r).then(function (s) {
      var v = val(s); if (!v) throw { code: 'invalid_argument' }; tx.set(r, { j: JSON.stringify(merge(v, d)), t: Date.now() }); }); }); },
    onSnapshot: function (fn) { return r.onSnapshot(function (s) { var v = val(s); fn({ exists: !!v, data: function () { return v; }, metadata: s.metadata }); }); }
  }; } };
};
if ('serviceWorker' in navigator) addEventListener('load', function () { navigator.serviceWorker.register('sw.js'); });

<body>
<title>Backgammon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* The app: friends float at their Elo on a sky that follows the time of day; tapping a game opens the board on the same sky.
   Colours below are the daytime set; the clock code swaps them for the night set after dusk. */
:root {
  --page: #E6ECEA; --ink: #1F2D2E; --muted: #4A5859; --line: rgba(31,45,46,0.14);
  --glass: rgba(250,252,251,0.52); --glass-strong: rgba(250,252,251,0.82); --sheet: #F4F6F5;
  --accent: #2F5D62; --on-accent: #FFFFFF;
  --warm: oklch(0.74 0.11 55); --warm-ink: oklch(0.38 0.08 50); --win: oklch(0.66 0.09 160); --loss: oklch(0.68 0.10 25);
  --p1: oklch(0.90 0.065 80); --p2: oklch(0.90 0.06 165); --p3: oklch(0.89 0.06 240); --sky: oklch(0.925 0.03 150);
  --g1: oklch(0.76 0.09 45); --g2: oklch(0.76 0.09 350); --g3: oklch(0.76 0.09 290);
  --font: 'Figtree', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
html, body { height: 100%; margin: 0; }
body { background: var(--sky); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.45; overflow: hidden; overscroll-behavior: none; -webkit-user-select: none; user-select: none; }
button { font-family: inherit; color: inherit; -webkit-tap-highlight-color: transparent; cursor: pointer; }
button:focus-visible { outline: 2.5px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }

/* ---------- home ---------- */
#home { position: fixed; inset: 0; overflow: hidden; overflow: clip; isolation: isolate; }
#home > .sky { position: absolute; inset: 0; z-index: 0; background: var(--sky); }
.col { position: absolute; left: calc(50% - min(50%, 280px)); width: min(100%, 560px); }
.bhead { top: calc(env(safe-area-inset-top, 0px) + 28px); z-index: 3; display: flex; flex-direction: column; gap: 2px; padding: 0 22px; box-sizing: border-box; }
.bhead b { font-size: 24px; font-weight: 700; letter-spacing: -0.01em; }
.bhead span { font-size: 14px; color: var(--muted); }
.field { top: 0; bottom: 0; touch-action: none; }
.axis { position: absolute; left: 10px; top: 0; bottom: 0; width: 40px; pointer-events: none; }
.axis span { position: absolute; left: 0; font-size: 11px; font-weight: 600; color: var(--muted); opacity: .7; font-variant-numeric: tabular-nums; }
.axis span::after { content: ""; position: absolute; left: 34px; top: 8px; width: 480px; border-top: 1px dashed var(--line); }
.star { position: absolute; left: 0; top: 0; width: 86px; border: none; background: none; padding: 0; display: flex; flex-direction: column; align-items: center; gap: 5px; will-change: transform; touch-action: none; cursor: grab; }
.star.held { cursor: grabbing; z-index: 2; }
.star .orb { transition: transform .25s cubic-bezier(.2,.8,.2,1); }
.star.held .orb { transform: scale(1.08); }
.orb { width: 62px; height: 62px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700; background: var(--glass-strong); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border: 1.5px solid var(--line); position: relative; }
.orb.me { background: var(--accent); color: var(--on-accent); border-color: transparent; }
.orb.yours { background: var(--warm); color: #2A1A0C; border-color: transparent; }
.orb.yours::before { content: ""; position: absolute; inset: -10px; border-radius: 50%; background: var(--warm); opacity: .35; z-index: -1; animation: halo 3.4s ease-in-out infinite; }
@keyframes halo { 50% { transform: scale(1.18); opacity: .12; } }
.orb.them { border: 2px solid var(--accent); }
.orb.req::after { content: ""; position: absolute; inset: -7px; border-radius: 50%; border: 2px dashed var(--accent); animation: spin 14s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.star small { font-size: 12px; font-weight: 600; line-height: 1.1; text-align: center; }
.star small em { display: block; font-style: normal; font-weight: 500; color: var(--muted); font-variant-numeric: tabular-nums; }
.legend { bottom: calc(env(safe-area-inset-bottom, 0px) + 16px); z-index: 3; padding: 0 16px; box-sizing: border-box; }
.legend div { display: flex; justify-content: space-between; gap: 6px; padding: 10px 14px; border-radius: 18px; background: var(--glass); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); font-size: 12px; color: var(--muted); }
.legend span { display: flex; align-items: center; gap: 6px; }
.legend i { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }

/* shared pieces */
.av { width: 38px; height: 38px; border-radius: 50%; flex: 0 0 auto; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; background: var(--glass-strong); border: 1.5px solid var(--line); color: var(--ink); }
.av.me { background: var(--accent); color: var(--on-accent); border-color: transparent; }
.label { font-size: 12px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); margin: 18px 4px 8px; }
.row { width: 100%; display: flex; align-items: center; gap: 12px; padding: 10px 12px; border: none; border-radius: 18px; background: var(--page); text-align: left; margin-bottom: 8px; font-size: 15px; }
.row .t { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; }
.row .t b { font-weight: 600; }
.row .t small { font-size: 13px; color: var(--muted); }
.row.yours { background: color-mix(in oklab, var(--warm) 34%, var(--page)); }
.row.yours small { color: var(--warm-ink); }
.row.req { outline: 1.5px dashed var(--accent); outline-offset: -1.5px; }
.num { font-variant-numeric: tabular-nums; }
.pip { width: 10px; height: 10px; border-radius: 50%; background: var(--warm); flex: 0 0 auto; animation: breathe 3.2s ease-in-out infinite; }
@keyframes breathe { 50% { transform: scale(1.35); opacity: .6; } }
.mini { border: 1.5px solid var(--line); background: transparent; border-radius: 12px; height: 34px; padding: 0 12px; font-size: 13px; font-weight: 600; }
.mini.go { background: var(--accent); color: var(--on-accent); border-color: transparent; }
.big { width: 100%; height: 54px; border-radius: 18px; border: none; background: var(--accent); color: var(--on-accent); font-size: 17px; font-weight: 700; }
.res { width: 26px; height: 26px; border-radius: 9px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: #fff; flex: 0 0 auto; }
.res.W { background: var(--win); } .res.L { background: var(--loss); }
.tools { display: flex; flex-wrap: wrap; gap: 8px; }

/* overlays */
.scrim { position: absolute; inset: 0; z-index: 20; background: rgba(8,12,22,0); backdrop-filter: blur(0px); -webkit-backdrop-filter: blur(0px); transition: background-color .3s ease, backdrop-filter .3s ease; border: none; padding: 0; display: none; }
.scrim.show { display: block; }
.scrim.open { background: rgba(8,12,22,0.30); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
.card { top: calc(env(safe-area-inset-top, 0px) + 20px); bottom: calc(env(safe-area-inset-bottom, 0px) + 14px); z-index: 21; display: none; padding: 0 14px; box-sizing: border-box; pointer-events: none; }
.card > div { pointer-events: auto; height: 100%; background: var(--sheet); border-radius: 30px; padding: 22px 20px; box-sizing: border-box; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; opacity: 0; transform: scale(.2); transition: transform .38s cubic-bezier(.2,.8,.2,1), opacity .22s ease; box-shadow: 0 24px 60px rgba(8,12,22,0.28); scrollbar-width: none; }
.card.show { display: block; } .card.open > div { opacity: 1; transform: none; }
.card-top { display: flex; align-items: center; gap: 14px; }
.card-top .av { width: 54px; height: 54px; font-size: 18px; }
.card-top h4 { margin: 0; font-size: 24px; font-weight: 700; }
.card-top p { margin: 0; color: var(--muted); font-size: 14px; }
.x { margin-left: auto; width: 40px; height: 40px; border-radius: 50%; border: none; background: transparent; display: flex; align-items: center; justify-content: center; color: var(--muted); }
.tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.tile { background: var(--page); border-radius: 16px; padding: 10px 12px; }
.tile small { display: block; font-size: 12px; color: var(--muted); }
.tile b { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
.strip { display: flex; gap: 4px; } .strip i { flex: 1; height: 20px; border-radius: 6px; }
.strip i.W { background: var(--win); } .strip i.L { background: var(--loss); }
.sheet { bottom: 0; z-index: 21; background: var(--sheet); border-radius: 30px 30px 0 0; padding: 12px 22px calc(env(safe-area-inset-bottom, 0px) + 26px); box-sizing: border-box; display: flex; flex-direction: column; gap: 6px; transform: translateY(105%); transition: transform .42s cubic-bezier(.2,.8,.2,1); box-shadow: 0 -10px 30px rgba(8,12,22,0.16); }
.sheet.open { transform: none; }
.grab { width: 40px; height: 5px; border-radius: 3px; background: var(--line); align-self: center; margin-bottom: 8px; }
.sheet h4 { margin: 0 0 6px; font-size: 22px; font-weight: 700; }
.pick { display: flex; gap: 10px; overflow-x: auto; padding: 4px 2px 6px; scrollbar-width: none; }
.pick button { border: none; background: none; padding: 0; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; color: var(--muted); }
.pick button .av { width: 48px; height: 48px; }
.pick button[aria-pressed="true"] { color: var(--ink); }
.pick button[aria-pressed="true"] .av { background: var(--accent); color: var(--on-accent); border-color: transparent; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { height: 40px; min-width: 48px; border-radius: 14px; border: 1.5px solid var(--line); background: transparent; font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); border-color: transparent; }
.toggle { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; font-size: 15px; }
.toast { bottom: calc(env(safe-area-inset-bottom, 0px) + 90px); z-index: 30; padding: 0 18px; box-sizing: border-box; pointer-events: none; opacity: 0; transform: translateY(10px); transition: opacity .4s ease, transform .4s ease; }
.toast div { background: var(--sheet); color: var(--ink); border-radius: 16px; padding: 12px 16px; font-size: 14px; font-weight: 500; box-shadow: 0 8px 22px rgba(10,15,30,0.18); }
.toast.show { opacity: 1; transform: none; }

/* ---------- board ---------- */
#gv { position: fixed; inset: 0; z-index: 40; background: var(--sky); }
#gv .device { position: absolute; inset: 0; overflow: hidden; color: var(--ink);
  padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
#gv .av { border: none; }
#gv .railTop { display: flex; justify-content: center; margin-bottom: 4px; }
#gv .homeBtn { height: 28px; padding: 0 12px 0 8px; border: none; border-radius: 14px; background: var(--glass); display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; color: var(--ink); }
#gv .turnMsg { display: none; }
@media (orientation: portrait) and (max-width: 700px) {
  #gv .turnMsg { display: flex; position: absolute; inset: 0; z-index: 60; align-items: center; justify-content: center; flex-direction: column; gap: 14px; padding: 32px; text-align: center; font-size: 17px; font-weight: 600; background: var(--sky); }
}

#gv .sky { position: absolute; inset: 0; background: var(--gbase); }
#gv .game { position: absolute; inset: 0; display: flex; gap: 12px; padding: 12px 16px 12px 36px; box-sizing: border-box; }
#gv .game.flip { flex-direction: row-reverse; padding: 12px 36px 12px 16px; }
#gv .boardWrap { position: relative; flex: 1 1 auto; min-width: 0; }
#gv #board { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; border-radius: 14px; box-shadow: 0 10px 28px rgba(30,18,8,0.28); }

#gv .rail { flex: 0 0 128px; display: flex; flex-direction: column; justify-content: space-between; align-items: stretch; gap: 6px; padding: 2px 0; }
#gv .score { display: flex; align-items: baseline; justify-content: center; gap: 8px; text-shadow: 0 1px 10px var(--glass-strong); }
#gv .score b { font-size: 30px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
#gv .score span { font-size: 20px; color: var(--muted); }
#gv .score small { font-size: 12px; color: var(--muted); font-weight: 600; margin-left: 2px; }
#gv .status { min-height: 34px; font-size: 12px; line-height: 1.35; text-align: center; color: var(--muted); font-weight: 500; text-shadow: 0 1px 8px var(--glass-strong); }
#gv .who { display: flex; align-items: center; gap: 9px; padding: 6px 8px; border-radius: 16px; transition: background-color .8s ease; }
#gv .who.turn { background: var(--glass); }
#gv .who b { display: block; font-size: 14px; font-weight: 700; }
#gv .who small { display: block; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
#gv .av { width: 34px; height: 34px; border-radius: 50%; flex: 0 0 auto; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; position: relative; }
#gv .av.them { background: #2F3B42; color: #E9E2D2; }
#gv .av.me { background: #F3ECDF; color: #3A3026; box-shadow: inset 0 0 0 1.5px #D8CDB9; }
#gv .who.turn .av::after { content: ""; position: absolute; inset: -5px; border-radius: 50%; border: 2px solid var(--accent); opacity: .7; animation: gbreathe 3s ease-in-out infinite; }
@keyframes gbreathe { 50% { transform: scale(1.08); opacity: .3; } }

#gv .cube { align-self: center; border: none; background: transparent; display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 4px; }
#gv .cube .face { width: 50px; height: 50px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums;
  background: var(--glass-strong); color: var(--ink); box-shadow: 0 4px 12px rgba(10,15,30,0.14), inset 0 0 0 1.5px var(--line); transition: transform .3s cubic-bezier(.2,.8,.2,1), background-color .3s ease; }
#gv .cube .cl { font-size: 12px; font-weight: 700; color: var(--muted); }
#gv .cube.live .face { background: #B8352F; color: #FFFFFF; box-shadow: 0 6px 16px rgba(60,10,5,0.30); }
#gv .cube.live { cursor: grab; touch-action: none; }
#gv .cube.dragging .face { opacity: 0.25; }
#gv .cube.live .cl { color: var(--ink); }
#gv .cube.armed .face { transform: scale(1.12) rotate(-6deg); animation: gwob 1s ease-in-out infinite; }
@keyframes gwob { 50% { transform: scale(1.12) rotate(6deg); } }
#gv .cube:not(.live) { cursor: default; }
#gv .acts { display: flex; gap: 6px; min-height: 36px; }
#gv .acts button { flex: 1; height: 36px; border-radius: 12px; font-size: 13px; font-weight: 700; border: none; transition: opacity .3s ease; }
#gv .acts .ghost { background: var(--glass); }
#gv .acts .go { background: var(--accent); color: var(--on-accent); }
#gv .acts button[hidden] { display: block !important; visibility: hidden; }

#gv .slide { position: absolute; pointer-events: none; font-size: 16px; font-weight: 700; color: #FFFFFF; white-space: nowrap; text-shadow: 0 1px 3px rgba(40,20,10,0.65), 0 0 14px rgba(40,20,10,0.45); transform: translate(-50%, -100%); }
#gv .slide[hidden], #gv .over[hidden], #gv .cubeFloat[hidden] { display: none !important; }
#gv .cubeFloat { position: absolute; left: 0; top: 0; width: 50px; height: 50px; z-index: 5; pointer-events: none; perspective: 400px; }
#gv .cubeFloat.home { transition: left .35s cubic-bezier(.2,.8,.2,1), top .35s cubic-bezier(.2,.8,.2,1); }
#gv .cf-in { position: absolute; inset: 0; transform-style: preserve-3d; }
#gv .cf { position: absolute; inset: 0; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 700; backface-visibility: hidden; -webkit-backface-visibility: hidden; box-shadow: 0 10px 22px rgba(30,10,5,0.35); }
#gv .cf.front { background: #B8352F; color: #FFFFFF; }
#gv .cf.back { background: var(--g1); color: #3A1A10; transform: rotateY(180deg); box-shadow: 0 10px 22px rgba(30,10,5,0.35), inset 0 0 0 2px rgba(255,255,255,0.7); }
#gv .over { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; }
#gv .over div { pointer-events: auto; background: var(--glass-strong); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); padding: 18px 24px; border-radius: 22px; text-align: center; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 16px 40px rgba(8,12,22,0.25); }
#gv .over b { font-size: 22px; }
#gv .over button { height: 40px; border-radius: 12px; border: none; background: var(--accent); color: var(--on-accent); font-weight: 700; font-size: 15px; padding: 0 16px; }
#gv .over button.alt { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--line); }
#gv .over span { color: var(--muted); font-size: 13px; max-width: 300px; }

#gv .case { position: absolute; inset: 0; z-index: 4; perspective: 2600px; }
#gv .case canvas { position: absolute; top: 0; height: 100%; display: block; }
#gv .case .lh { left: 0; border-radius: 14px 0 0 14px; }
#gv .case .leaf { position: absolute; top: 0; bottom: 0; transform-origin: 0 50%; transform-style: preserve-3d; }
#gv .case .fr { left: 0; width: 100%; border-radius: 0 14px 14px 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
#gv .case .shade { position: absolute; inset: 0; background: #1A0E05; opacity: 0; border-radius: inherit; pointer-events: none; }
#gv .case .leaf > .shade { border-radius: 0 14px 14px 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
#gv .case .bk { position: absolute; inset: 0; transform: rotateY(180deg); backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 14px 0 0 14px;
  background: repeating-linear-gradient(92deg, rgba(40,20,8,0.10) 0 2px, transparent 2px 11px), repeating-linear-gradient(88deg, rgba(255,230,190,0.06) 0 1px, transparent 1px 23px), linear-gradient(160deg, #7C5535, #5E3E25 60%, #4E3320);
  box-shadow: 0 14px 30px rgba(30,18,8,0.35), inset 0 0 0 3px rgba(40,22,10,0.45), inset 0 0 0 9px rgba(255,225,180,0.06); }
#gv .case .bk b { position: absolute; left: -6px; top: 50%; width: 14px; height: 46px; margin-top: -23px; border-radius: 5px; background: linear-gradient(90deg, #C9A45C, #E8CF8E 50%, #A9843E); box-shadow: 0 2px 5px rgba(0,0,0,0.35); }
#gv .case .bk .shade { border-radius: 14px 0 0 14px; }

@media (prefers-reduced-motion: reduce) { .orb.yours::before, .orb.req::after, .pip, #gv .who.turn .av::after, #gv .cube.armed .face { animation: none; } }
</style>

<div id="home">
  <div class="sky" id="sky"></div>
  <div class="col bhead"><b id="bTitle"></b><span>Higher up means higher Elo. Tap anyone, or pull them around.</span></div>
  <div class="col field" id="field"><div class="axis" id="axis"></div></div>
  <div class="col legend"><div><span><i style="background:var(--warm)"></i>Your turn</span><span><i style="border:2px solid var(--accent)"></i>Their turn</span><span><i style="border:2px dashed var(--accent)"></i>Challenge</span></div></div>
  <button class="scrim" id="scrim" aria-label="Close"></button>
  <div class="col card" id="card" role="dialog" aria-modal="true"><div id="cardIn"></div></div>
  <div class="col sheet" id="sheet" role="dialog" aria-modal="true"></div>
  <div class="col toast" id="toast" role="status"><div id="toastIn"></div></div>
</div>

<div id="gv" hidden>
  <div class="device" id="device">
    <div class="sky" id="gsky"></div>
    <div class="cubeFloat" id="cubeFloat" hidden><div class="cf-in" id="cfIn"><div class="cf front" id="cfFront">×1</div><div class="cf back" id="cfBack">×2</div></div></div>
    <div class="game" id="game">
      <div class="boardWrap" id="wrap"><canvas id="board" aria-label="Backgammon board"></canvas><div class="slide" id="slide" hidden>Slide to end your turn →</div><div class="over" id="over" hidden></div></div>
      <aside class="rail" id="rail">
        <div>
          <div class="railTop"><button class="homeBtn" id="homeBtn" aria-label="Back to your friends"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="7" cy="9" r="3.2"/><circle cx="16.5" cy="6.5" r="2.4"/><circle cx="15" cy="16" r="3.6"/></svg>Friends</button></div>
          <div class="score"><b id="scMe">0</b><span>–</span><b id="scThem">0</b><small>to 5</small></div>
          <div class="status" id="status" role="status"></div>
        </div>
        <div class="who" id="whoThem"><div class="av them" id="avThem">NO</div><div><b id="nmThem">Nolf</b><small id="pipThem"></small></div></div>
        <button class="cube" id="cube"><span class="face" id="cubeFace">×2</span><span class="cl" id="cubeLabel">Double</span></button>
        <div class="who" id="whoMe"><div class="av me" id="avMe">QU</div><div><b>You</b><small id="pipMe"></small></div></div>
      </aside>
    </div>
    <div class="turnMsg"><svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="2.5" width="10" height="19" rx="2.5"/><path d="M20 14a8 8 0 0 1-6 7.5M18.5 19.5l-4.5 2 1.8-4.4"/></svg>Turn your phone sideways to play.</div>
  </div>
</div>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var Q = location.search;

  /* ---------- Sky by the clock (moods from the Bubble app). ?hour=21 pins an hour, ?fastday runs 24 h in a minute. ---------- */
  var MOODS = [[0, .24, .055, [285, 310, 255]], [5, .36, .06, [300, 330, 255]], [6.5, .80, .065, [345, 60, 290]], [8, .92, .075, [350, 95, 200]],
    [12, .94, .05, [110, 200, 60]], [15, .91, .06, [90, 150, 230]], [18, .88, .07, [70, 30, 250]], [19.5, .76, .09, [45, 350, 290]],
    [20.5, .36, .06, [300, 330, 255]], [22, .24, .055, [285, 310, 255]], [24, .24, .055, [285, 310, 255]]];
  var DARKV = { '--ink': '#E7EEEF', '--muted': '#A7B5B8', '--line': 'rgba(231,238,239,0.16)', '--glass': 'rgba(22,29,38,0.50)', '--glass-strong': 'rgba(26,33,42,0.86)', '--accent': '#8EC3C2', '--on-accent': '#10201F', '--sheet': '#1C232B', '--page': '#11161B', '--warm-ink': 'oklch(0.90 0.05 60)' };
  var LIGHTV = { '--ink': '#1F2D2E', '--muted': '#4A5859', '--line': 'rgba(31,45,46,0.14)', '--glass': 'rgba(250,252,251,0.52)', '--glass-strong': 'rgba(250,252,251,0.82)', '--accent': '#2F5D62', '--on-accent': '#FFFFFF', '--sheet': '#F4F6F5', '--page': '#E6ECEA', '--warm-ink': 'oklch(0.38 0.08 50)' };
  var pinH = (Q.match(/[?&]hour=([\d.]+)/) || [])[1], fast = /[?&]fastday/.test(Q), lastDark = null, root = document.documentElement;
  function hueMix(a, b, t) { var d = ((b - a + 540) % 360) - 180; return (a + d * t + 360) % 360; }
  function hourNow() {
    if (pinH != null) return +pinH % 24;
    if (fast) return (performance.now() / 60000 * 24 + 6) % 24;
    var d = new Date(); return d.getHours() + d.getMinutes() / 60 + d.getSeconds() / 3600;
  }
  function dayTick() {
    var h = hourNow(), i = 0; while (MOODS[i + 1][0] <= h) i++;
    var A = MOODS[i], B = MOODS[i + 1], t = (h - A[0]) / (B[0] - A[0]); t = t * t * (3 - 2 * t);
    var L = A[1] + (B[1] - A[1]) * t, C = A[2] + (B[2] - A[2]) * t;
    for (var k = 0; k < 3; k++) {
      var hue = hueMix(A[3][k], B[3][k], t).toFixed(1);
      root.style.setProperty('--p' + (k + 1), 'oklch(' + L.toFixed(3) + ' ' + C.toFixed(3) + ' ' + hue + ')');
      /* The board's highlights keep the hue of the hour but stay light enough to read on wood, day or night. */
      root.style.setProperty('--g' + (k + 1), 'oklch(0.76 0.09 ' + hue + ')');
    }
    root.style.setProperty('--sky', 'oklch(' + Math.min(0.97, L + 0.02).toFixed(3) + ' ' + (C * 0.5).toFixed(3) + ' ' + hueMix(A[3][0], B[3][0], t).toFixed(1) + ')');
    var dark = L < 0.55;
    if (dark !== lastDark) { lastDark = dark; var V = dark ? DARKV : LIGHTV; for (var v in V) root.style.setProperty(v, V[v]); root.style.colorScheme = dark ? 'dark' : 'light'; }
  }
  dayTick(); setInterval(dayTick, fast ? 100 : 5000);

  /* ---------- friends (sample data until the real accounts exist) ---------- */
  var ME = { id: 'qu', n: 'Quad', i: 'QU', elo: 1500, d: 0 };
  var P = [ME, { id: 'no', n: 'Nolf', i: 'NO', elo: 1500, d: 0 }];
  var byId = {}; P.forEach(function (p) { byId[p.id] = p; });
  var GAMES = [{ p: 'no', s: 'yours', sc: [0, 0], to: 5, when: 'now', duo: true }];
  var H2H = { no: { w: 0, l: 0, g: '0–0', last: '' } };
  var HIST = [];
  var X = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>';
  var CHEV = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="opacity:.5;flex:0 0 auto"><path d="M9 6l6 6-6 6"/></svg>';
  var waiting = GAMES.filter(function (g) { return g.s === 'yours' || g.s === 'req'; }).length;
  $('bTitle').textContent = waiting === 1 ? 'One game waits for you' : waiting ? ['', '', 'Two', 'Three', 'Four'][waiting] + ' games wait for you' : 'Nothing waits for you';

  function gameRow(g) {
    var p = byId[g.p];
    if (g.s === 'req') return '<div class="row req"><div class="av">' + p.i + '</div><div class="t"><b>' + p.n + ' challenges you</b><small>to ' + g.to + (g.cube ? ' · cube on' : '') + ' · ' + g.when + '</small></div><button class="mini" data-act="decline" data-p="' + p.id + '">No</button><button class="mini go" data-act="accept" data-p="' + p.id + '">Play</button></div>';
    return '<button class="row ' + (g.s === 'yours' ? 'yours' : '') + '" data-act="board" data-p="' + p.id + '"><div class="av">' + p.i + '</div><div class="t"><b>vs ' + p.n + '</b><small class="num">' + g.sc.join('–') + ' to ' + g.to + ' · ' + (g.s === 'yours' ? 'your turn' : 'their turn') + ' · ' + g.when + '</small></div>' + (g.s === 'yours' ? '<span class="pip"></span>' : CHEV) + '</button>';
  }
  function histRow(m) {
    var p = byId[m.p];
    return '<button class="row" data-act="player" data-p="' + p.id + '"><span class="res ' + m.r + '">' + m.r + '</span><div class="t"><b>vs ' + p.n + '</b><small class="num">' + m.sc + ' to ' + m.to + (m.gam ? ' · gammon' : '') + '</small></div><small style="color:var(--muted)">' + m.d + '</small></button>';
  }

  var tt;
  function toast(msg) { $('toastIn').textContent = msg; $('toast').classList.add('show'); clearTimeout(tt); tt = setTimeout(function () { $('toast').classList.remove('show'); }, 2200); }

  /* ---------- player card: grows from where you tapped ---------- */
  function openCard(html, from) {
    var c = $('card'), ci = $('cardIn'), s = $('scrim');
    ci.innerHTML = html; s.classList.add('show'); c.classList.add('show');
    if (from) { var r = from.getBoundingClientRect(), cr = ci.getBoundingClientRect(); ci.style.transformOrigin = (r.left + r.width / 2 - cr.left) + 'px ' + (r.top + r.height / 2 - cr.top) + 'px'; }
    else ci.style.transformOrigin = '50% 50%';
    requestAnimationFrame(function () { requestAnimationFrame(function () { s.classList.add('open'); c.classList.add('open'); }); });
  }
  function closeAll() {
    var c = $('card'), s = $('scrim'), sh = $('sheet');
    c.classList.remove('open'); s.classList.remove('open'); sh.classList.remove('open');
    setTimeout(function () { if (!c.classList.contains('open')) c.classList.remove('show'); if (!s.classList.contains('open')) s.classList.remove('show'); }, 380);
  }
  function playerCard(id) {
    if (id === ME.id) {
      return '<div class="card-top"><div class="av me">' + ME.i + '</div><div><h4>' + ME.n + '</h4><p class="num">Elo ' + ME.elo.toLocaleString('en') + '</p></div><button class="x" data-act="close" aria-label="Close">' + X + '</button></div>' +
        '<div class="tiles"><div class="tile"><small>Matches</small><b>' + HIST.length + '</b></div><div class="tile"><small>Won</small><b>–</b></div><div class="tile"><small>Gammons</small><b>0</b></div></div>' +
        '<div><div class="label" style="margin:0 4px 8px">For testing</div><div class="tools"><button class="mini" data-act="seat">Who plays on this device</button><button class="mini" data-act="bearoff">Bear-off position</button><button class="mini" data-act="restart">Start the match over</button></div></div>' +
        (HIST.length ? '<div class="label" style="margin:4px 4px 0">Your history</div><div>' + HIST.map(histRow).join('') + '</div>' : '');
    }
    var p = byId[id], h = H2H[id], g = GAMES.filter(function (x) { return x.p === id; })[0];
    var out = '<div class="card-top"><div class="av">' + p.i + '</div><div><h4>' + p.n + '</h4><p class="num">Elo ' + p.elo.toLocaleString('en') + '</p></div><button class="x" data-act="close" aria-label="Close">' + X + '</button></div>';
    if (g) out += gameRow(g);
    out += '<div class="tiles"><div class="tile"><small>You vs ' + p.n + '</small><b>' + h.w + '–' + h.l + '</b></div><div class="tile"><small>Win rate</small><b>' + (h.w + h.l ? Math.round(100 * h.w / (h.w + h.l)) + '%' : '–') + '</b></div><div class="tile"><small>Gammons</small><b>' + h.g + '</b></div></div>';
    if (h.last) out += '<div><div class="label" style="margin:0 4px 8px">Last ' + h.last.length + '</div><div class="strip">' + h.last.split('').map(function (r) { return '<i class="' + r + '"></i>'; }).join('') + '</div></div>';
    var ms = HIST.filter(function (m) { return m.p === id; });
    if (ms.length) out += '<div>' + ms.map(histRow).join('') + '</div>';
    if (!g) out += '<button class="big" data-act="new" data-p="' + id + '" style="margin-top:auto">Challenge ' + p.n + '</button>';
    return out;
  }

  /* ---------- new game sheet ---------- */
  var ng = { p: 'no', to: 5, cube: true };
  function sheetHTML() {
    return '<div class="grab"></div><h4>New game</h4><div class="label" style="margin:6px 0 4px">Against</div><div class="pick">' +
      P.filter(function (p) { return p !== ME; }).map(function (p) { return '<button data-act="ngp" data-p="' + p.id + '" aria-pressed="' + (ng.p === p.id) + '"><div class="av">' + p.i + '</div>' + p.n + '</button>'; }).join('') +
      '</div><div class="label" style="margin:10px 0 6px">Match to</div><div class="chips">' +
      [1, 3, 5, 7, 11].map(function (n) { return '<button class="chip" data-act="ngto" data-n="' + n + '" aria-pressed="' + (ng.to === n) + '">' + n + '</button>'; }).join('') +
      '</div><div class="toggle"><span>Doubling cube</span><button class="mini' + (ng.cube ? ' go' : '') + '" data-act="ngcube">' + (ng.cube ? 'On' : 'Off') + '</button></div>' +
      '<button class="big" data-act="send">Send challenge</button>';
  }
  function openSheet(pid) {
    if (pid) ng.p = pid;
    $('card').classList.remove('open');
    var sh = $('sheet'), s = $('scrim');
    sh.innerHTML = sheetHTML(); s.classList.add('show');
    requestAnimationFrame(function () { requestAnimationFrame(function () { s.classList.add('open'); sh.classList.add('open'); }); });
  }

  /* ---------- opening a board ---------- */
  function openGame(pid) {
    var g = GAMES.filter(function (x) { return x.p === pid; })[0], p = byId[pid];
    closeAll();
    window.BG.open({ id: pid, name: p.n, ini: p.i, duo: !!(g && g.duo), score: g && g.sc ? { me: g.sc[0], them: g.sc[1] } : null });
  }
  function whenBoard(fn, n) { n = n || 0; if (window.BG.ready() || n > 30) fn(); else setTimeout(function () { whenBoard(fn, n + 1); }, 300); }

  $('home').addEventListener('click', function (e) {
    var b = e.target.closest('[data-act]'); if (!b) return;
    var a = b.dataset.act, pid = b.dataset.p;
    if (a === 'close') closeAll();
    else if (a === 'player') openCard(playerCard(pid), b);
    else if (a === 'board') openGame(pid);
    else if (a === 'accept') { GAMES = GAMES.filter(function (g) { return g.p !== pid; }).concat({ p: pid, s: 'yours', sc: [0, 0], to: 7, when: 'now' }); markOrbs(); openGame(pid); }
    else if (a === 'decline') { GAMES = GAMES.filter(function (g) { return g.p !== pid; }); markOrbs(); closeAll(); toast('Challenge declined.'); }
    else if (a === 'new') openSheet(pid);
    else if (a === 'ngp') { ng.p = pid; $('sheet').innerHTML = sheetHTML(); }
    else if (a === 'ngto') { ng.to = +b.dataset.n; $('sheet').innerHTML = sheetHTML(); }
    else if (a === 'ngcube') { ng.cube = !ng.cube; $('sheet').innerHTML = sheetHTML(); }
    else if (a === 'send') { closeAll(); toast('Challenge sent to ' + byId[ng.p].n + '.'); }
    else if (a === 'seat') { closeAll(); window.BG.seat(); }
    else if (a === 'bearoff') { closeAll(); if (!window.BG.current()) openGame('no'); whenBoard(function () { window.BG.bearOff(); }); }
    else if (a === 'restart') { closeAll(); if (!window.BG.current()) openGame('no'); whenBoard(function () { window.BG.restart(); }); }
  });
  $('scrim').addEventListener('click', closeAll);
  $('home').addEventListener('scroll', function () { $('home').scrollTop = 0; $('home').scrollLeft = 0; });

  /* ---------- the orbs: each friend floats at their Elo; the height is a water surface ---------- */
  var field = $('field'), stars = [];
  var XS = { qu: 0.32, no: 0.68 };
  var TUNE = { fall: 1100, thick: 8, buoy: 9, bounce: 230, float: 3, grip: 29, resist: 2.2, wind: 0.75, drift: 4 };
  var R = 44, OX = 43, OY = 31;
  P.forEach(function (p) {
    var el = document.createElement('button');
    el.className = 'star'; el.setAttribute('aria-label', p.n + ', Elo ' + p.elo);
    el.innerHTML = '<div class="orb">' + p.i + '</div><small>' + p.n + '<em>' + p.elo.toLocaleString('en') + '</em></small>';
    field.appendChild(el);
    var s = { el: el, p: p, x: 0, y: 0, vx: 0, vy: 0, hy: 0, ph: Math.random() * 6.28, placed: false, drag: null, side: 0 };
    stars.push(s);
    el.addEventListener('pointerdown', function (e) {
      var f = field.getBoundingClientRect();
      el.setPointerCapture(e.pointerId);
      s.drag = { ox: e.clientX - f.left - s.x, oy: e.clientY - f.top - s.y, px: e.clientX - f.left, py: e.clientY - f.top, sx: e.clientX, sy: e.clientY, t: performance.now(), moved: false };
      el.classList.add('held');
    });
    el.addEventListener('pointermove', function (e) {
      if (!s.drag) return;
      var f = field.getBoundingClientRect();
      s.drag.px = e.clientX - f.left; s.drag.py = e.clientY - f.top;
      if (Math.hypot(e.clientX - s.drag.sx, e.clientY - s.drag.sy) > 7) s.drag.moved = true;
    });
    function release() {
      if (!s.drag) return;
      var d = s.drag; s.drag = null; el.classList.remove('held');
      if (!d.moved && performance.now() - d.t < 400) { s.vx = s.vy = 0; openCard(playerCard(p.id), el); return; }
      s.side = Math.abs(s.y - s.hy) > 3 ? Math.sign(s.y - s.hy) : 0;
    }
    el.addEventListener('pointerup', release);
    el.addEventListener('pointercancel', release);
    el.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openCard(playerCard(p.id), el); } });
  });
  function markOrbs() {
    stars.forEach(function (s) {
      var g = GAMES.filter(function (x) { return x.p === s.p.id; })[0];
      s.el.firstChild.className = 'orb ' + (s.p === ME ? 'me' : g ? (g.s === 'yours' ? 'yours' : g.s === 'req' ? 'req' : 'them') : '');
    });
  }
  markOrbs();
  var LO = 1350, HI = 1625, FW = 0, FH = 0, REST_X = 0;
  function yOf(elo, H) { var top = 170, bot = H - 120; return bot - (elo - LO) / (HI - LO) * (bot - top); }
  function layoutB() {
    FW = field.clientWidth; FH = field.clientHeight;
    $('axis').innerHTML = [1400, 1500, 1600].map(function (v) { return '<span style="top:' + (yOf(v, FH) - 8).toFixed(0) + 'px">' + v + '</span>'; }).join('');
    stars.forEach(function (s) { s.hy = yOf(s.p.elo, FH); if (!s.placed) { s.x = XS[s.p.id] * FW; s.y = s.hy; s.placed = true; } });
    var sx = 0; for (var id in XS) sx += XS[id]; REST_X = sx / Object.keys(XS).length * FW;
  }
  /* Sky: pool 1 sits on the (smoothed) mean of the orbs; pools 2 and 3 are the first two seeds of a sunflower spiral around it,
     wound by how far the friends have been pushed sideways, with a very slow drift. */
  var GEO = { p1: null }, THETA0 = -Math.PI / 3, GOLDEN_ANGLE = Math.PI * (3 - Math.sqrt(5));
  function skyB(dt, t) {
    var mx = 0, my = 0; stars.forEach(function (s) { mx += s.x; my += s.y; }); mx /= stars.length; my /= stars.length;
    if (!GEO.p1) GEO.p1 = [mx, my];
    var f = 1 - Math.exp(-dt / 1.2);
    GEO.p1[0] += (mx - GEO.p1[0]) * f; GEO.p1[1] += (my - GEO.p1[1]) * f;
    var sh = Math.max(-1, Math.min(1, (GEO.p1[0] - REST_X) / (FW * 0.25)));
    var D = Math.hypot(field.offsetLeft * 2 + FW, FH), d = TUNE.wind * 2 * Math.PI * sh;
    var th = THETA0 + d + 2 * Math.PI * t / (TUNE.drift * 60), cc = Math.min(0.8 * D, 0.24 * D * (1 + Math.abs(d) / (2 * Math.PI)));
    var ox = field.offsetLeft, c = [GEO.p1[0] + ox, GEO.p1[1]];
    var Pt = [c, [c[0] + cc * Math.cos(th + GOLDEN_ANGLE), c[1] + cc * Math.sin(th + GOLDEN_ANGLE)], [c[0] + Math.min(0.8 * D, cc * Math.SQRT2) * Math.cos(th + 2 * GOLDEN_ANGLE), c[1] + Math.min(0.8 * D, cc * Math.SQRT2) * Math.sin(th + 2 * GOLDEN_ANGLE)]];
    var ST = [4, 2, 1], V = ['--p1', '--p2', '--p3'];
    $('sky').style.background = [2, 1, 0].map(function (i) {
      return 'radial-gradient(circle ' + (0.62 * D * Math.sqrt(ST[i] / 4)).toFixed(0) + 'px at ' + Pt[i][0].toFixed(0) + 'px ' + Pt[i][1].toFixed(0) + 'px, var(' + V[i] + ') 0%, transparent 100%)';
    }).join(', ') + ', var(--sky)';
  }
  function smoothstep(a, b, x) { var u = Math.max(0, Math.min(1, (x - a) / (b - a))); return u * u * (3 - 2 * u); }
  /* Each orb's Elo line is a water surface: the side you pull it to is air (it falls back, speeding up); past the line is
     water (thick drag, buoyancy floats it back). Sideways it stays where you leave it. Slow touches nudge, fast ones bounce. */
  function step(dt, t) {
    var minX = 64, maxX = FW - 40, minY = 130, maxY = FH - 84;
    stars.forEach(function (s) {
      if (s.drag) {
        var fx = Math.max(minX, Math.min(maxX, s.drag.px - s.drag.ox)), fy = Math.max(minY, Math.min(maxY, s.drag.py - s.drag.oy));
        var kg = TUNE.grip, cg = Math.max(1, TUNE.resist) * 2 * Math.sqrt(kg), dx0 = fx - s.x, dy0 = fy - s.y;
        s.vx += (kg * dx0 - cg * s.vx) * dt; s.vy += (kg * dy0 - cg * s.vy) * dt;
        s.x += s.vx * dt; s.y += s.vy * dt;
        if (dx0 * (fx - s.x) + dy0 * (fy - s.y) < 0) { s.x = fx; s.y = fy; s.vx = s.vy = 0; }
        return;
      }
      var off = s.y - (s.hy + Math.sin(t * 0.55 + s.ph) * TUNE.float);
      if (!s.side && Math.abs(off) > 6) s.side = Math.sign(off);
      var inAir = s.side && Math.sign(off) === s.side, ay, drag;
      if (inAir) { ay = -s.side * TUNE.fall - 0.3 * s.vy; drag = 1.2; }
      else { ay = -TUNE.buoy * off - TUNE.thick * s.vy; drag = 1.2 + TUNE.thick * 0.25; }
      if (s.side && Math.abs(off) < 1.5 && Math.abs(s.vy) < 12) s.side = 0;
      s.vx += (-drag * s.vx + Math.sin(t * 0.21 + s.ph * 2) * 5) * dt; s.vy += ay * dt;
      s.x += s.vx * dt; s.y += s.vy * dt;
      if (s.x < minX) { s.x = minX; if (s.vx < 0) s.vx = -s.vx * 0.35; }
      if (s.x > maxX) { s.x = maxX; if (s.vx > 0) s.vx = -s.vx * 0.35; }
      if (s.y < minY) { s.y = minY; if (s.vy < 0) s.vy = -s.vy * 0.35; }
      if (s.y > maxY) { s.y = maxY; if (s.vy > 0) s.vy = -s.vy * 0.35; }
    });

    DUO.lastDoc = d;
    G.score = { me: (d.score && d.score[DUO.seat]) || 0, them: (d.score && d.score[DUO.other]) || 0 };
    $('scMe').textContent = G.score.me; $('scThem').textContent = G.score.them;
    G.cube = { v: d.cube.v, owner: d.cube.owner ? sideOf(d.cube.owner) : null };
    applyBoard(d.board);
    var prev = G.phase;
    if (d.phase === 'opening') { applyOpening(d, fresh); cubeUI(); return; }
    if (d.phase === 'over') {
      G.phase = 'over'; cubeUI();
      if (!DUO.overShown && d.result) {
        DUO.overShown = true; $('cubeFloat').hidden = true; $('cube').classList.remove('dragging');
        if (d.result.dropped && prev === 'wait') spinSky();
        showOver(sideOf(d.result.winner), d.result.pts, d.result.dropped, d.result.gammon);
      }
      return;
    }
    if (d.phase === 'offered') {
      if (d.offerBy === DUO.other) {
        clearDice(); setTurn(TH);
        if (prev !== 'offered') { G.phase = 'offered'; spinSky(); }
        say(NAME.them + ' doubles to ×' + G.cube.v * 2 + '. Tap it to take, or hold and slide to give up.');
      } else { setTurn(ME); if (prev !== 'wait') { G.phase = 'wait'; if (fresh) spinSky(); } say(NAME.them + ' is thinking about your double…'); }
      cubeUI(); return;
    }
    var t = sideOf(d.turn);
    if (t === ME) {
      if (d.phase === 'roll') {
        clearDice(); G.phase = 'roll'; setTurn(ME);
        if (prev === 'wait' && G.cube.owner === TH) {
          spinSky(); floatHome($('whoThem'), function () { $('cube').classList.remove('dragging'); cubeUI(); });
          say(NAME.them + ' took it. Playing for ' + G.cube.v + '. Throw your dice.');
        } else say('Your turn. Throw your dice.');
      } else { setTurn(ME); applyDice(d.dice, false); G.phase = 'move'; G.hist = []; afterMyMove(true); }
    } else {
      setTurn(TH); G.phase = 'remote';
      if (d.phase === 'roll') { clearDice(); say(NAME.them + '’s turn to throw.'); }
      else { applyDice(d.dice, !fresh); say(NAME.them + ' is playing.'); }
    }
    cubeUI();
  }
  /* Opening roll: each device throws its own die and merges it in. Once both dice have landed, the higher one
     starts; that device writes the start. On a tie, your device (seat A) clears both for another throw. */
  function applyOpening(d, fresh) {
    var mine = (d.open && d.open[DUO.seat]) || (DUO.myOpen && DUO.myOpen.round === (d.round || 0) ? DUO.myOpen : null), his = d.open && d.open[DUO.other];
    var dm = D.filter(function (x) { return x.live && x.side === ME; }), dh = D.filter(function (x) { return x.live && x.side === TH; });
    if (!mine && dm.length) { dm.forEach(function (x) { x.live = false; }); D = D.filter(function (x) { return x.live; }); dm = []; }
    if (!his && dh.length) { dh.forEach(function (x) { x.live = false; }); D = D.filter(function (x) { return x.live; }); dh = []; DUO.openN.his = null; }
    if (his && DUO.openN.his !== his.n) {
      DUO.openN.his = his.n; dh.forEach(function (x) { x.live = false; }); D = D.filter(function (x) { return x.live; });
      if (!fresh && his.t) throwVec(TH, [his.v], his.t, settleSync); else placeDie(TH, his.v);
    }
    if (mine && !dm.length) placeDie(ME, mine.v);
    G.turn = mine ? TH : ME; G.phase = mine ? 'openWait' : 'opening';
    say(!mine ? (his ? NAME.them + ' rolled ' + his.v + '. Throw yours.' : 'Throw your die to see who starts.') : his ? '' : 'Waiting for ' + NAME.them + ' to throw.');
    checkOpening();
  }
  function duoOpenThrow(from) {
    throwDice(ME, 1, from, settleSync);
    var dd = D[D.length - 1], up = { by: DUO.seat, open: {} };
    DUO.myOpen = { v: dd.v, n: nonce(), t: [vecOf(dd)], round: (DUO.lastDoc && DUO.lastDoc.round) || 0 };
    up.open[DUO.seat] = { v: DUO.myOpen.v, n: DUO.myOpen.n, t: DUO.myOpen.t };
    G.phase = 'openWait';
    enqueue(function () { return DUO.ref.update(up); });
  }
  function settleSync() {
    var d = DUO && DUO.lastDoc; if (!d) return;
    if (d.phase === 'opening') checkOpening(); else if (d.phase === 'move') applyDice(d.dice, false);
  }
  function checkOpening() {
    var d = DUO.lastDoc; if (!d || d.phase !== 'opening' || G.rolling) return;
    var dm = D.filter(function (x) { return x.live && x.side === ME; })[0], dh = D.filter(function (x) { return x.live && x.side === TH; })[0];
    if (!dm || !dh || !dm.settled || !dh.settled) return;
    var key = d.game + ':' + (d.round || 0); if (DUO.resolved === key) return; DUO.resolved = key;
    if (dm.v === dh.v) {
      say('Both ' + dm.v + '. Throw again.');
      if (DUO.seat === 'A') setTimeout(function () {
        var ld = DUO.lastDoc; if (!ld || ld.phase !== 'opening' || ld.game + ':' + (ld.round || 0) !== key) return;
        var doc = JSON.parse(JSON.stringify(ld)); doc.v = DUO.V + 1; doc.by = DUO.seat; doc.round = (ld.round || 0) + 1; doc.open = { A: null, B: null };
        DUO.V = doc.v; applyShared(doc, false); enqueue(function () { return DUO.ref.set(doc); });
      }, 1100);
      return;
    }
    var starter = dm.v > dh.v ? ME : TH;
    say((starter === ME ? 'You start' : NAME.them + ' starts') + ' with ' + Math.max(dm.v, dh.v) + ' and ' + Math.min(dm.v, dh.v) + '.');
    setTimeout(function () {
      var ld = DUO.lastDoc; if (!ld || ld.phase !== 'opening' || ld.game + ':' + (ld.round || 0) !== key) return;
      [dm, dh].forEach(function (x) { x.side = starter; x.tidy = true; x.popT = 0; });
      D.sort(function (a, b) { return b.v - a.v; });
      setTurn(starter);
      if (starter === ME) { G.phase = 'move'; G.hist = []; DUO.diceN = nonce(); DUO.diceT = null; afterMyMove(); }
      else { G.phase = 'remote'; say(NAME.them + ' is playing.'); }
    }, 1300);
  }
  function setNames() {
    var them = DUO ? SEATS[DUO.other] : OPP, me = DUO ? SEATS[DUO.seat] : { ini: 'QU' };
    NAME.them = them.name; $('nmThem').textContent = them.name; $('avThem').textContent = them.ini; $('avMe').textContent = me.ini;
  }
  function joinDuo(seat) {
    if (DUO && DUO.unsub) DUO.unsub();
    DUO = { seat: seat, other: seat === 'A' ? 'B' : 'A', ref: DB.doc('games/duo'), V: 0, chain: Promise.resolve(), game: null, openN: {}, first: true, lastDoc: null };
    setNames(); resetLocal({ game: null }); say('Joining the shared game…');
    var me = DUO, timer = setTimeout(function () { if (DUO === me) say('Can’t reach the shared game yet.'); }, 10000);
    me.unsub = me.ref.onSnapshot(function (snap) {
      if (DUO !== me) return;
      clearTimeout(timer);
      if (!snap.exists) { if (me.first) { me.first = false; newGame(true); } return; }
      var d = snap.data(), fresh = me.first; me.first = false;
      if (!d || !d.board) return;
      if (!fresh) {
        if ((d.v || 0) < me.V) return;
        if (d.by === me.seat && (d.v || 0) <= me.V && d.phase !== 'opening') return;
      }
      me.V = Math.max(me.V, d.v || 0);
      applyShared(d, fresh);
    }, function (e) { clearTimeout(timer); if (DUO === me) say('Lost the shared game' + (e && e.code ? ' (' + e.code + ')' : '') + '. Reload to try again.'); });
  }
  function leaveDuo() {
    if (DUO && DUO.unsub) DUO.unsub();
    DUO = null; setNames(); G = null; start();
  }
  function pickSeat() {
    var o = $('over'); o.hidden = false;
    o.innerHTML = '<div><b>Who plays on this device?</b><span>Open this page on both devices and pick a different side on each.</span>' +
      '<button data-s="A">Quad</button><button data-s="B">Nolf</button><button data-s="ai" class="alt">Play against the computer</button></div>';
    Array.prototype.forEach.call(o.querySelectorAll('button'), function (b) {
      b.addEventListener('click', function () {
        var s = b.getAttribute('data-s'); try { localStorage.setItem('duoSeat', s); } catch (e) {}
        o.hidden = true; if (s === 'ai') { if (DUO) leaveDuo(); } else joinDuo(s);
      });
    });
  }
  /* Local testing only: two tabs on this computer share a fake store through localStorage (add ?mock&seat=A). */
  function mockDb() {
    var subs = [];
    function read(p) { try { return JSON.parse(localStorage.getItem('mock:' + p)); } catch (e) { return null; } }
    function snap(p) { var v = read(p); return { exists: !!v, data: function () { return v; }, metadata: {} }; }
    function emit(p) { subs.forEach(function (s) { if (s.p === p) s.fn(snap(p)); }); }
    window.addEventListener('storage', function (e) { if (e.key && e.key.indexOf('mock:') === 0) emit(e.key.slice(5)); });
    function merge(a, b) { Object.keys(b).forEach(function (k) { if (b[k] && typeof b[k] === 'object' && !Array.isArray(b[k]) && a[k] && typeof a[k] === 'object') merge(a[k], b[k]); else a[k] = b[k]; }); return a; }
    return { doc: function (p) { return {
      set: function (d) { return new Promise(function (r) { setTimeout(function () { localStorage.setItem('mock:' + p, JSON.stringify(d)); emit(p); r(); }, 120); }); },
      update: function (d) { return new Promise(function (r, j) { setTimeout(function () { var v = read(p); if (!v) { j({ code: 'invalid_argument' }); return; } localStorage.setItem('mock:' + p, JSON.stringify(merge(v, d))); emit(p); r(); }, 120); }); },
      onSnapshot: function (fn) { var s = { p: p, fn: fn }; subs.push(s); setTimeout(function () { fn(snap(p)); }, 60); return function () { subs = subs.filter(function (x) { return x !== s; }); }; }
    }; } };
  }
  function connect() {
    var q = location.search, use = window.claude && window.claude.use ? window.claude.use('db') : Promise.resolve(/[?&]mock/.test(q) ? mockDb() : (window.fbDb ? window.fbDb() : null));
    use.then(function (db) {
      if (!db) { NODB = true; if (PENDING) { var f0 = PENDING; PENDING = null; f0(); } return; }
      DB = db;
      if (PENDING) { var f = PENDING; PENDING = null; f(); }
    }).catch(function () { NODB = true; });
  }

  /* ---------- App hooks: the home screen opens and closes the board ---------- */
  var OPP = { name: 'Nolf', ini: 'NO' }, CUR = null, PENDING = null, NODB = false;
  function storedSeat() { var m = location.search.match(/[?&]seat=([AB])/); if (m) return m[1]; try { return localStorage.getItem('duoSeat'); } catch (e) { return null; } }
  function showBoard() { $('gv').hidden = false; layout(); paintSky(skyA); }
  window.BG = {
    open: function (o) {
      showBoard();
      if (o.duo && !NODB) {
        if (!DB) { PENDING = function () { window.BG.open(o); }; if (!G) { OPP = o; setNames(); start(); } say('Connecting to the shared game…'); return; }
        CUR = 'duo';
        if (!DUO) { CASE.fresh = true; var s = storedSeat(); if (s === 'A' || s === 'B') joinDuo(s); else pickSeat(); }
        return;
      }
      if (DUO) { if (DUO.unsub) DUO.unsub(); DUO = null; }
      var fresh = CUR !== o.id || !G; CUR = o.id; OPP = o; setNames();
      if (fresh) { CASE.fresh = true; G = null; start(); }
    },
    close: function () { $('gv').hidden = true; $('over').hidden = true; },
    seat: function () { CUR = 'duo'; showBoard(); if (DB) pickSeat(); else say('The shared game needs the published page.'); },
    bearOff: function () { tryBearOff(); },
    restart: function () { if (DUO) newGame(true); else { G = null; start(); } },
    current: function () { return DUO ? 'no' : CUR; },
    ready: function () { return !!G && $('over').hidden && !$('gv').hidden && (CUR !== 'duo' || !!(DUO && DUO.lastDoc)); }
  };
  $('homeBtn').addEventListener('click', function () { window.BG.close(); if (window.onBoardClosed) window.onBoardClosed(); });

  /* ---------- start ---------- */
  function start() {
    $('over').hidden = true;
    var keep = G ? G.score : (OPP.score || { me: 0, them: 0 });
    G = { turn: ME, phase: 'opening', hist: [], cube: { v: 1, owner: null }, score: keep, rolling: false };
    $('scMe').textContent = keep.me; $('scThem').textContent = keep.them;
    setup(); D = []; pips(); setTurn(ME);
    var v = rnd6(), R = region(TH), d = newDie(TH, v, (R.x0 + R.x1) / 2, L.mid, 0, 0);
    d.settled = true; d.face = v; d.tidy = true; d.a = 0; D.push(d);
    say(NAME.them + ' rolled ' + v + ' when they challenged you. Throw yours.');
  }
  window.addEventListener('resize', function () { if (!$('gv').hidden) layout(); });

  /* Full screen: on a phone the first tap anywhere asks for it (and for landscape); on desktop use the button. */
  function goFull() {
    var el = document.documentElement, req = el.requestFullscreen || el.webkitRequestFullscreen;
    if (!req || document.fullscreenElement || document.webkitFullscreenElement) return;
    try {
      var p = req.call(el, { navigationUI: 'hide' });
      if (p && p.then) p.then(function () { if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(function () {}); }).catch(function () {});
    } catch (e) {}
  }
  function onFullChange() {
    var on = !!(document.fullscreenElement || document.webkitFullscreenElement);
    document.body.classList.toggle('full', on);
    setTimeout(function () { fit(); layout(); }, 60);
  }
  document.addEventListener('fullscreenchange', onFullChange);
  document.addEventListener('webkitfullscreenchange', onFullChange);
  connect();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { fit(); });
  requestAnimationFrame(frame);
})();
</script>
